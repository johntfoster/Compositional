name: Verified input blocks

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - ".github/CODEOWNERS"
      - ".github/workflows/verified-input-blocks.yml"
      - ".codex/skills/deck-*/**"
      - ".codex/skills/verified-block-promotion/**"
      - ".codex/verified-input-blocks/**"
      - "agent_workflows/**"
      - "moose_app/input/**"
      - "moose_app/test/**"
  push:
    paths:
      - "AGENTS.md"
      - ".github/CODEOWNERS"
      - ".github/workflows/verified-input-blocks.yml"
      - ".codex/skills/deck-*/**"
      - ".codex/skills/verified-block-promotion/**"
      - ".codex/verified-input-blocks/**"
      - "agent_workflows/**"
      - "moose_app/input/**"
      - "moose_app/test/**"

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install workflow validators
        run: python -m pip install PyYAML jsonschema
      - name: Validate registry and generated assemblies
        run: python agent_workflows/scripts/verified_blocks.py validate --all-assemblies
      - name: Test verified-block tooling
        run: python -m unittest agent_workflows.tests.test_verified_blocks
