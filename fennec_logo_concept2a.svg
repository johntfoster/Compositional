<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F1923"/>
      <stop offset="100%" stop-color="#1A2A3A"/>
    </linearGradient>
    <radialGradient id="poreGrad" cx="0.4" cy="0.35">
      <stop offset="0%" stop-color="#F5C542"/>
      <stop offset="100%" stop-color="#D4782F"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="24" fill="url(#bg)"/>

  <!-- Flow channels (edges) — structured mesh of a porous network -->
  <g stroke="#D4782F" stroke-width="2.5" fill="none" opacity="0.5">
    <!-- Horizontal channels -->
    <line x1="80" y1="120" x2="432" y2="120"/>
    <line x1="80" y1="200" x2="432" y2="200"/>
    <line x1="80" y1="280" x2="432" y2="280"/>
    <line x1="80" y1="360" x2="432" y2="360"/>
    <!-- Vertical channels — some broken (pore connectivity variation) -->
    <line x1="120" y1="80" x2="120" y2="410"/>
    <line x1="200" y1="80" x2="200" y2="280"/>
    <line x1="200" y1="340" x2="200" y2="410"/>
    <line x1="280" y1="80" x2="280" y2="200"/>
    <line x1="280" y1="260" x2="280" y2="410"/>
    <line x1="360" y1="80" x2="360" y2="410"/>
  </g>

  <!-- Pore nodes at intersections -->
  <g fill="url(#poreGrad)">
    <circle cx="120" cy="120" r="8"/>
    <circle cx="200" cy="120" r="7"/>
    <circle cx="280" cy="120" r="6.5"/>
    <circle cx="360" cy="120" r="8"/>
    <circle cx="120" cy="200" r="7.5"/>
    <circle cx="200" cy="200" r="9"/>
    <circle cx="280" cy="200" r="8"/>
    <circle cx="360" cy="200" r="6"/>
    <circle cx="120" cy="280" r="6"/>
    <circle cx="280" cy="280" r="8.5"/>
    <circle cx="360" cy="280" r="7"/>
    <circle cx="120" cy="360" r="8"/>
    <circle cx="200" cy="360" r="6.5"/>
    <circle cx="280" cy="360" r="7"/>
    <circle cx="360" cy="360" r="8"/>
  </g>

  <!-- Detached/disconnected pores (isolated porosity) -->
  <circle cx="200" cy="315" r="4" fill="#D4782F" opacity="0.3"/>
  <circle cx="310" cy="145" r="3.5" fill="#D4782F" opacity="0.25"/>
  <circle cx="170" cy="340" r="3" fill="#D4782F" opacity="0.2"/>
  <circle cx="390" cy="245" r="3.5" fill="#D4782F" opacity="0.25"/>

  <!-- Flow particle along channels -->
  <circle cx="160" cy="120" r="3" fill="#F5C542" opacity="0.8"/>
  <circle cx="280" cy="155" r="2.5" fill="#F5C542" opacity="0.7"/>
  <circle cx="360" cy="240" r="2" fill="#F5C542" opacity="0.6"/>
  <circle cx="200" cy="380" r="3" fill="#F5C542" opacity="0.8"/>

  <!-- Wordmark -->
  <text x="256" y="470" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" letter-spacing="18" fill="#F5C542">FENNEC</text>
</svg>
