<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="earOuter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8A860"/>
      <stop offset="100%" stop-color="#D4883C"/>
    </linearGradient>
    <linearGradient id="earInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5DCC0"/>
      <stop offset="100%" stop-color="#F0C8A0"/>
    </linearGradient>
    <linearGradient id="forehead" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EDC090"/>
      <stop offset="100%" stop-color="#E0A870"/>
    </linearGradient>
    <linearGradient id="cheek" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8B880"/>
      <stop offset="100%" stop-color="#F2D4B0"/>
    </linearGradient>
  </defs>

  <!-- ====== ANGULARIZED FENNEC FOX HEAD ====== -->

  <!-- LEFT EAR — outer -->
  <polygon points="170,260 185,140 160,40 200,60 250,150 240,210" fill="url(#earOuter)"/>
  <!-- LEFT EAR — inner (lighter) -->
  <polygon points="185,240 192,150 178,68 200,85 235,165 230,210" fill="url(#earInner)"/>

  <!-- RIGHT EAR — outer -->
  <polygon points="342,260 327,140 352,40 312,60 262,150 272,210" fill="url(#earOuter)"/>
  <!-- RIGHT EAR — inner (lighter) -->
  <polygon points="327,240 320,150 334,68 312,85 277,165 282,210" fill="url(#earInner)"/>

  <!-- FOREHEAD — angular crown between ears -->
  <polygon points="240,210 250,150 262,150 272,210" fill="url(#forehead)"/>
  <polygon points="220,225 240,210 272,210 292,225 256,195" fill="#EDC090"/>

  <!-- WHITE FOREHEAD STRIPE (angular) -->
  <polygon points="248,170 264,170 268,195 244,195" fill="#FDF5EC"/>

  <!-- LEFT CHEEK — angular -->
  <polygon points="170,260 220,225 240,210 200,260 150,270" fill="url(#cheek)"/>
  <polygon points="170,260 200,260 185,285 155,280" fill="#E8B880"/>

  <!-- RIGHT CHEEK — angular -->
  <polygon points="342,260 292,225 272,210 312,260 362,270" fill="#F2D4B0"/>
  <polygon points="342,260 312,260 327,285 357,280" fill="#E8B880"/>

  <!-- WHITE MUZZLE AREA — angular -->
  <polygon points="220,225 256,195 292,225 290,280 256,315 222,280" fill="#FDF5EC"/>
  <polygon points="240,210 256,195 272,210 258,240 254,240" fill="#FEFAF5"/>

  <!-- DARK TEAR-MARK — left (angular) -->
  <polygon points="215,225 225,228 222,255 210,248" fill="#3A2A1A" opacity="0.7"/>
  <polygon points="222,255 230,258 225,270 215,265" fill="#3A2A1A" opacity="0.6"/>

  <!-- DARK TEAR-MARK — right (angular) -->
  <polygon points="297,225 287,228 290,255 302,248" fill="#3A2A1A" opacity="0.7"/>
  <polygon points="290,255 282,258 287,270 297,265" fill="#3A2A1A" opacity="0.6"/>

  <!-- LEFT EYE — angular almond -->
  <polygon points="205,228 218,224 232,228 228,238 212,238" fill="#1A1008"/>
  <!-- eye highlight -->
  <polygon points="210,230 218,227 222,230 218,233" fill="#F0C078"/>

  <!-- RIGHT EYE — angular almond -->
  <polygon points="307,228 294,224 280,228 284,238 300,238" fill="#1A1008"/>
  <!-- eye highlight -->
  <polygon points="302,230 294,227 290,230 294,233" fill="#F0C078"/>

  <!-- NOSE — angular -->
  <polygon points="248,302 256,295 264,302 260,310 252,310" fill="#1A1008"/>
  <!-- nose highlight -->
  <polygon points="252,300 256,297 260,300 256,303" fill="#3A2A1A"/>

  <!-- MOUTH LINE — angular -->
  <polyline points="256,310 256,320" stroke="#3A2A1A" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <polyline points="248,316 256,320 264,316" stroke="#3A2A1A" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- ====== FINITE ELEMENT MESH OVERLAY ====== -->
  <!-- Structured quadrilateral grid over the face, conforming to the angular shape -->
  <g stroke="#3A2A1A" stroke-width="0.9" fill="none" opacity="0.18">
    <!-- Horizontal rows -->
    <line x1="210" y1="178" x2="302" y2="178"/>
    <line x1="200" y1="198" x2="312" y2="198"/>
    <line x1="188" y1="218" x2="324" y2="218"/>
    <line x1="175" y1="238" x2="337" y2="238"/>
    <line x1="168" y1="258" x2="344" y2="258"/>
    <line x1="172" y1="278" x2="340" y2="278"/>
    <line x1="185" y1="298" x2="327" y2="298"/>
    <line x1="200" y1="318" x2="312" y2="318"/>

    <!-- Near-vertical columns (non-crossing) -->
    <line x1="218" y1="198" x2="200" y2="318"/>
    <line x1="237" y1="170" x2="210" y2="325"/>
    <line x1="256" y1="160" x2="256" y2="330"/>
    <line x1="275" y1="170" x2="302" y2="325"/>
    <line x1="294" y1="198" x2="312" y2="318"/>
  </g>

  <!-- Mesh over ears -->
  <g stroke="#3A2A1A" stroke-width="0.7" fill="none" opacity="0.12">
    <!-- Left ear mesh -->
    <line x1="185" y1="120" x2="230" y2="160"/>
    <line x1="178" y1="80" x2="215" y2="145"/>
    <line x1="172" y1="55" x2="200" y2="100"/>
    <line x1="175" y1="90" x2="210" y2="90"/>
    <line x1="190" y1="60" x2="225" y2="130"/>
    <!-- Right ear mesh -->
    <line x1="327" y1="120" x2="282" y2="160"/>
    <line x1="334" y1="80" x2="297" y2="145"/>
    <line x1="340" y1="55" x2="312" y2="100"/>
    <line x1="337" y1="90" x2="302" y2="90"/>
    <line x1="322" y1="60" x2="287" y2="130"/>
  </g>

  <!-- ====== WHISKERS — angular, sweeping outward ====== -->
  <g stroke="#FDF5EC" stroke-width="1.3" fill="none" opacity="0.6">
    <!-- Left -->
    <polyline points="185,262 140,258 90,252"/>
    <polyline points="183,275 130,275 75,275"/>
    <polyline points="188,288 145,292 95,300"/>
    <!-- Right -->
    <polyline points="327,262 372,258 422,252"/>
    <polyline points="329,275 382,275 437,275"/>
    <polyline points="324,288 367,292 417,300"/>
  </g>
</svg>
