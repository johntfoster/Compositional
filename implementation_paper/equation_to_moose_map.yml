# Traceability map from manuscript and implementation-paper equations to future
# MOOSE objects. Fill exact labels as kernels and materials are introduced.

schema_version: 1
maps:
  - id: component_mass_balance
    status: implemented_reference_balance_and_standard_darcy_slice
    source:
      theory_manuscript:
        labels:
          - "eq:component_spatial_mass"
          - "eq:component_partial_density_representation"
          - "eq:reference_relative_mass_flux"
          - "eq:solid_reference_flux_divergence"
          - "eq:solid_reference_fluid_component_balance"
          - "eq:solid_reference_solid_component_balance"
          - "eq:standard_darcy_mass_flux_limit"
          - "eq:pulled_back_modified_permeability"
        sections:
          - "sections/material_mass.tex"
          - "sections/pulled_back_solid_skeleton.tex"
      implementation_paper:
        labels:
          - "eq:reference_flux_closure"
          - "eq:reference_modified_permeability"
          - "eq:fluid_component_residual"
        sections:
          - "sections/reference_solid_weak_forms.tex"
    role: "solid-reference fluid component mass residual"
    moose_plan:
      variables:
        - "component_storage = J phi_xi rhobar_xi eta_xi^alpha"
      kernels:
        - "ADReferenceFluidComponentBalance"
        - "ADReferenceComponentStorageTerm"
        - "ADReferenceComponentFluxTerm (one each for solid dispersion and diffusion)"
        - "ADReferenceComponentSourceTerm"
      materials:
        - "ADSolidReferenceKinematics"
        - "ADSolidPhaseMassVolumeMaterial for the source-free single-solid-component reduction"
        - "ADReferenceFluidComponentMaterial"
        - "ADReferenceComponentStorageMaterial"
        - "ADIdealMixtureFluidEOSMaterial"
        - "ADStandardDarcyReferenceFluxMaterial"
        - "ADReferenceFluidComponentFluxMaterial"
      userobjects: []
      boundary_conditions:
        - "ADReferenceFluidComponentFluxBC"
    assumptions_to_record:
      - "continuous Galerkin finite-element residual on the solid reference configuration"
      - "the first executable slice treats component storage as the solved scalar"
      - "phase relative flux and diffusive/dispersive component flux are supplied as functions for MMS tests"
      - "the storage-closure slice computes J phi_f rhobar_f eta_f^alpha as an AD material property from porosity, intrinsic density, component mass fraction, and solid kinematics"
      - "the Darcy closure slice uses the manuscript standard neutral, isothermal, conversion-free Darcy limit and its solid-reference pull-back"
      - "the ideal-mixture EOS slice can provide rhobar_f and J phi_f rhobar_f eta_f^alpha to the balance and Darcy materials"
      - "no upwinding or entropy stabilization is applied in this regression slice"
      - "phase equilibrium, EOS-derived intrinsic density, relative permeability, a constitutive law for the supported phase capillary contribution, charged forces, and nonisothermal terms remain follow-up closures"
    tests:
      - "moose_app/test/tests/reference_component_balance/reference_component_balance_1d.i"
      - "moose_app/test/tests/reference_component_balance/reference_component_balance_1d_natural_flux.i"
      - "moose_app/test/tests/reference_component_balance/reference_component_balance_2d.i"
      - "moose_app/test/tests/reference_component_balance/reference_component_balance_3d.i"
      - "moose_app/test/tests/reference_component_balance/darcy_storage_flux_1d.i"
      - "moose_app/test/tests/reference_component_balance/darcy_storage_flux_2d.i"
      - "moose_app/test/tests/reference_component_balance/darcy_storage_flux_3d.i"
      - "moose_app/test/tests/ideal_mixture_eos/eos_darcy_balance_1d.i"

      - "moose_app/test/tests/solid_phase_mass_volume/solid_phase_mass_volume_modes_1d.i"
  - id: thermodynamic_potentials
    status: implemented_reduced_ideal_mixture_eos
    source:
      theory_manuscript:
        labels:
          - "eq:component_partial_density_representation"
          - "eq:MC_phase_pressure_definitions"
          - "eq:MC_fluid_pressure_definition"
          - "eq:MC_solid_pressure_definition"
          - "eq:MC_absolute_neutral_component_potential"
          - "eq:MC_fluid_legendre_relation"
          - "eq:MC_neutral_component_euler_identity"
        sections:
          - "sections/material_mass.tex"
          - "sections/multicomponent_solids.tex"
      implementation_paper:
        labels: []
        sections:
          - "sections/algebraic_kinematic_closure.tex"
    role: "free energy, absolute neutral and electrochemical potentials, pressure, and derivative material properties"
    moose_plan:
      variables: []
      kernels: []
      materials:
        - "ADReferenceComponentStorageMaterial for component partial-density storage"
        - "ADDerivativeParsedMaterial for the user-supplied phase Helmholtz density and its first/second derivatives"
        - "ADHelmholtzEOSClosureMaterial for pressure, chemical potentials, entropy, and phase densities derived from that potential"
        - "ADHelmholtzElectricEnthalpyEOSMaterial for material plus dielectric phase pressure and absolute neutral potentials"
        - "ADIdealMixtureFluidEOSMaterial retained only as a restricted neutral, single-fluid compatibility regression"
      userobjects:
        - "EOS or phase-equilibrium user objects when parsed expressions are insufficient"
      boundary_conditions: []
    assumptions_to_record:
      - "state variables held fixed by each derivative"
      - "the general phase EOS input is Helmholtz density A_a(rho_a^1,...,rho_a^N,theta,...), with constituent partial densities per unit current phase volume"
      - "mu_a^alpha = partial A_a / partial rho_a^alpha, p_a = sum_alpha rho_a^alpha mu_a^alpha - A_a, and s_a = -partial A_a / partial theta"
      - "derivative_order = 2 supplies consistent thermodynamic Hessian properties and Newton couplings"
      - "ADIdealMixtureFluidEOSMaterial evaluates hat_mu_f^alpha at fixed phase volume fraction, temperature, other component densities, and kinematic/internal fields, with electric enthalpy omitted by the neutral reduction"
      - "slightly compressible density law rhobar_f = rhobar_0 exp(c_f (p_f - p_0))"
      - "the pressure identity rhobar_f^2 d psi_vol / d rhobar_f = p_f is exposed as a material diagnostic and tested away from the reference pressure"
      - "ideal-mixture Helmholtz specialization psi_f = psi_vol(rhobar_f) + sum_alpha eta_f^alpha [mu_ref^alpha + R_mix theta log(eta_f^alpha)] for positive mass fractions"
      - "the component potential implemented is psi_vol + p_f/rhobar_f + mu_ref^alpha + R_mix theta log(eta_f^alpha), the constituent-density derivative of the reduced Helmholtz storage"
      - "component mass fractions are supplied as primitive variables and are rejected if their sum differs from one beyond the configured tolerance"
      - "phase split or equilibrium algorithm"
      - "regularization near vanishing phases remains a follow-up"
      - "full electrochemical potentials require adding z_xi^alpha varphi to the neutral potentials in a later charged-transport slice"
    tests:
      - "moose_app/test/tests/user_helmholtz_eos/user_helmholtz_eos_1d.i"
      - "moose_app/test/tests/electric_enthalpy/helmholtz_electric_enthalpy_eos_1d.i"
      - "moose_app/test/tests/ideal_mixture_eos/ideal_mixture_eos_1d.i"
      - "moose_app/test/tests/ideal_mixture_eos/ideal_mixture_eos_2d.i"
      - "moose_app/test/tests/ideal_mixture_eos/ideal_mixture_eos_3d.i"
      - "moose_app/test/tests/ideal_mixture_eos/eos_darcy_balance_1d.i"

  - id: restricted_two_phase_constant_k_split
    status: implemented_restricted_bounded_two_phase_closure
    source:
      theory_manuscript:
        labels:
          - "eq:mass_fraction_constraint"
          - "eq:phase_volume_fraction"
          - "eq:volume_fraction_constraint"
          - "eq:component_partial_density_representation"
          - "eq:classical_compositional_closure_set"
          - "eq:classical_phase_equilibrium_mu"
        sections:
          - "sections/material_mass.tex"
          - "sections/correspondence_to_other_theories.tex"
      implementation_paper:
        labels:
          - "eq:implementation_component_density_partition"
          - "eq:implementation_volume_partition"
          - "eq:implementation_mass_fraction_partition"
          - "eq:implementation_phase_material_storage"
        sections:
          - "sections/algebraic_kinematic_closure.tex"
    role: "restricted active two-phase, two-component equilibrium split and total component storage"
    moose_plan:
      variables:
        - "overall component mass fractions z^alpha"
        - "total fluid volume fraction phi"
        - "phase intrinsic densities"
      kernels: []
      materials:
        - "ADTwoPhaseConstantKEquilibriumMaterial"
      userobjects: []
      boundary_conditions: []
    assumptions_to_record:
      - "two components and two phases only; this remains a restricted closure and is not the final oil/gas/water flash architecture"
      - "constant positive K-values with eta_1^alpha = K^alpha eta_0^alpha"
      - "interior phase split is used for 0 < beta < 1; endpoint branches set one phase present and one phase incipient"
      - "AD derivatives propagate through the selected branch after branching on the raw unbounded beta"
      - "overall mass fractions are rejected if they do not sum to one"
      - "phase volume fractions are reconstructed from mass split, phase densities, and total porosity"
      - "smooth complementarity, capillarity, pressure-dependent K-values, and full EOS flash remain follow-up work"
    tests:
      - "moose_app/test/tests/two_phase_constant_k_split/two_phase_split_1d.i"
      - "moose_app/test/tests/two_phase_constant_k_split/two_phase_split_2d.i"
      - "moose_app/test/tests/two_phase_constant_k_split/two_phase_split_3d.i"
      - "moose_app/test/tests/two_phase_constant_k_split/two_phase_split_balance_1d.i"
      - "moose_app/test/tests/two_phase_constant_k_split/two_phase_split_phase0_appears_1d.i"
      - "moose_app/test/tests/two_phase_constant_k_split/two_phase_split_phase1_appears_1d.i"
      - "moose_app/test/tests/two_phase_constant_k_split/two_phase_split_flux_balance_1d.i"

  - id: mobile_phase_history_kinematics
    status: implemented_phase_history_slice
    source:
      theory_manuscript:
        labels:
          - "eq:reference_relative_mass_flux"
          - "solid-reference pull-back and phase-attached material derivative discussion"
        sections:
          - "sections/material_mass.tex"
          - "sections/pulled_back_solid_skeleton.tex"
      implementation_paper:
        labels:
          - "eq:implementation_phase_velocity_reconstruction"
          - "eq:fluid_material_derivative_on_solid_frame"
          - "eq:implementation_phase_velocity_gradient"
          - "eq:implementation_phase_deformation_gradient_history"
          - "eq:implementation_phase_jacobian_history"
          - "eq:implementation_phase_deformation_gradient_residual"
          - "eq:implementation_phase_jacobian_residual"
        sections:
          - "sections/algebraic_kinematic_closure.tex"
          - "sections/reference_solid_weak_forms.tex"
    role: "arbitrary registered mobile-phase history deformation-gradient and Jacobian evolution on the registered solid reference mesh"
    moose_plan:
      variables:
        - "phase-specific row-major F_a components for every registered mobile phase"
        - "phase-specific J_a for every registered mobile phase"
        - "phase velocity components"
        - "reference relative mass flux W_a and current bulk phase density rho_a = phi_a rhobar_a for c_a"
      kernels:
        - "ADPhaseDeformationGradientHistory"
        - "ADPhaseJacobianHistory"
      materials:
        - "ADSolidReferenceKinematics"
        - "ADPhaseHistoryKinematicsMaterial"
      userobjects:
        - "PhaseRegistry for arbitrary input-deck phase names and the selected reference phase"
      boundary_conditions: []
    assumptions_to_record:
      - "all weak forms, Grad/Div operators, sources, fluxes, and boundary measures remain on the solid skeleton reference configuration"
      - "F_s = I + Grad_X u_s and J_s = det(F_s) define the pull-back; F_a and J_a are separate phase-history fields stored on the solid mesh"
      - "l_a = Grad_X(v_a) F_s^{-1}"
      - "c_a = F_s^{-1}(v_a - v_s) = W_a/(J_s rho_a)"
      - "input decks initialize a history-free phase with F_a = I and J_a = 1 unless they supply another consistent history"
      - "inactive phases use c_a = 0 and l_a = 0 below active_tol and preserve stored phase history"
    tests:
      - "moose_app/test/tests/phase_registry/registered_four_phase_eos_1d.i"
      - "moose_app/test/tests/phase_history_kinematics/oil_phase_history_extension_1d.i"
      - "moose_app/test/tests/phase_history_kinematics/gas_phase_history_shear_2d.i"
      - "moose_app/test/tests/phase_history_kinematics/water_phase_history_diagonal_3d.i"
      - "moose_app/test/tests/phase_history_kinematics/oil_phase_history_relative_advection_1d.i"
      - "moose_app/test/tests/phase_history_kinematics/gas_phase_history_inactive_policy_1d.i"

  - id: selectable_registered_phase_momentum
    status: implemented_full_and_reduced_paths
    source:
      theory_manuscript:
        labels:
          - "eq:el_mom_f_dynamic_capillary"
          - "eq:generalized_fluid_darcy_mass_flux"
          - "eq:reference_relative_mass_flux"
        sections:
          - "sections/pulled_back_solid_skeleton.tex"
          - "sections/virtual_power_derivation.tex"
      implementation_paper:
        labels:
          - "eq:implementation_full_phase_momentum_residual"
        sections:
          - "sections/reference_solid_weak_forms.tex"
    role: "per-registered-phase selection between a velocity-based full momentum solve and algebraically eliminated relative flux"
    moose_plan:
      variables:
        - "phase velocity components for model full"
        - "reference relative mass flux for model relative_flux"
      kernels:
        - "ADRegisteredPhaseMomentum"
      materials:
        - "ADSolidReferenceKinematics"
        - "ADStandardDarcyReferenceFluxMaterial for the reduced path"
      userobjects:
        - "PhaseRegistry with per-phase momentum_models"
      boundary_conditions:
        - "ADRegisteredPhaseMomentumTractionBC"
    assumptions_to_record:
      - "full acceleration is partial_t v_a|_X + [F_s^{-1}(v_a-v_s)] dot Grad_X v_a"
      - "all current forces and Cauchy stresses are pulled back with J_s and F_s"
      - "built-in isotropic skeleton drag is mu_a phi_a^2/kappa_a times v_a-v_s"
      - "additional interaction forces represent fluid-fluid or other registered pair interactions"
      - "relative_flux is an algebraic reduction of the phase momentum equation, not a separate conservation law"
      - "include_capillary_pressure = false uses Grad p_E; true requires phase gamma_a and uses Grad(p_E + gamma_a) in both momentum paths"
    tests:
      - "moose_app/test/tests/phase_momentum_models/full_phase_momentum_1d.i"
      - "moose_app/test/tests/phase_momentum_models/full_phase_momentum_1d.i with include_capillary_pressure=true"
      - "moose_app/test/tests/phase_momentum_models/relative_flux_reduction_1d.i"
      - "moose_app/test/tests/phase_momentum_models/tests capillary switch contract RunException cases"

  - id: standard_darcy_relative_flux
    status: implemented_reduced_closure
    source:
      theory_manuscript:
        labels:
          - "eq:standard_darcy_mass_flux_limit"
          - "eq:black_oil_darcy_flux"
          - "eq:reference_relative_mass_flux"
          - "eq:pulled_back_modified_permeability"
        sections:
          - "sections/pulled_back_solid_skeleton.tex"
      implementation_paper:
        labels:
          - "eq:reference_flux_closure"
          - "eq:reference_modified_permeability"
        sections:
          - "sections/reference_solid_weak_forms.tex"
    role: "standard neutral Darcy relative mass flux pulled to the solid reference configuration"
    moose_plan:
      variables:
        - "pressure"
      kernels: []
      materials:
        - "ADStandardDarcyReferenceFluxMaterial"
        - "ADReferenceFluidComponentFluxMaterial"
      userobjects:
        - "PhaseRegistry when used as a registered relative_flux phase model"
      boundary_conditions: []
    assumptions_to_record:
      - "single phase or selected phase with prescribed scalar intrinsic permeability and either constant viscosity or a positive AD viscosity material property"
      - "relative permeability defaults to unity and may be supplied as an AD material property of saturation and history"
      - "intrinsic density may be supplied either as a coupled variable or as an AD material property from an EOS material"
      - "neutral isothermal Darcy reduction with no electrochemical force, thermal force, conversion-induced driving term, or internal relative-permeability/capillary constitutive law"
      - "include_acceleration = false gives the negligible-inertia reduction; true requires a supplied phase acceleration and retains the g-a_f body driver"
      - "include_capillary_pressure = false gives the noncapillary reduction; true requires supplied phase gamma_f and uses Grad(p_E + gamma_f)"
      - "component flux assembly multiplies the phase relative mass flux by eta_f^alpha and adds any supplied pulled-back extra component flux"
    tests:
      - "moose_app/test/tests/phase_momentum_models/relative_flux_reduction_1d.i"
      - "moose_app/test/tests/phase_momentum_models/relative_flux_reduction_1d.i with include_acceleration=true"
      - "moose_app/test/tests/phase_momentum_models/relative_flux_reduction_1d.i with include_capillary_pressure=true"
      - "moose_app/test/tests/phase_momentum_models/relative_flux_reduction_1d.i with an AD saturation-dependent relative permeability"
      - "moose_app/test/tests/phase_momentum_models/relative_flux_reduction_1d.i with an AD material viscosity"
      - "moose_app/test/tests/phase_momentum_models/relative_flux_reduction_1d.i with acceleration and capillary pressure enabled"
      - "moose_app/test/tests/phase_momentum_models/tests capillary switch contract RunException cases"
      - "moose_app/test/tests/reference_component_balance/darcy_storage_flux_1d.i"
      - "moose_app/test/tests/reference_component_balance/darcy_storage_flux_2d.i"
      - "moose_app/test/tests/reference_component_balance/darcy_storage_flux_3d.i"
      - "moose_app/test/tests/ideal_mixture_eos/eos_darcy_balance_1d.i"

  - id: conversion_corrected_phase_transforming_relative_flux
    status: implemented_scalar_and_anisotropic_ad_closures
    source:
      theory_manuscript:
        labels:
          - "eq:fluid_phase_interaction_law"
          - "eq:relative_flux_linear_system"
          - "eq:modified_relative_flux_permeability"
          - "eq:modified_relative_flux_scalar_admissibility"
        sections:
          - "sections/pulled_back_solid_skeleton.tex"
      implementation_paper:
        labels:
          - "eq:reference_flux_closure"
        sections:
          - "sections/reference_solid_weak_forms.tex"
    role: "conversion-corrected algebraic phase-relative flux with scalar or anisotropic permeability on the solid reference configuration"
    moose_plan:
      variables:
        - "phase pressure or a separately assembled phase-pressure gradient"
        - "transfer potential tau"
        - "solid velocity or displacement rate"
      kernels:
        - "ADRegisteredPhaseMomentum for the velocity-based drag-law path"
      materials:
        - "ADConversionCorrectedDarcyReferenceFluxMaterial"
        - "ADPhaseTransformingDarcyReferenceFluxMaterial"
        - "ADPhaseTransformingPressureGradientDarcyReferenceFluxMaterial"
        - "ADPhasePressureGradientAssemblerMaterial for selectable phase-pressure forces"
      userobjects:
        - "PhaseRegistry for the registered relative_flux path"
      boundary_conditions: []
    assumptions_to_record:
      - "the scalar closure inverts phi_f^2 mu_f/(k_f k_rf)+q_f and rejects a nonpositive resistance with a configurable positive margin"
      - "the anisotropic closure inverts phi_f^2 mu_f I+q_f k_rf K_f, requires symmetric-positive-definite K_f, and checks every conversion-corrected denominator eigenvalue"
      - "pressure, capillary or dynamic-lag pressure, electrical force, gravity, acceleration, and q_f(Grad_X tau-v_s) insertion are independently selectable in the full scalar force assembly"
      - "inactive or zero-relative-permeability phase limits are handled by the registered phase-transforming closure before algebraic inversion"
      - "the output current relative mass flux is pulled back as J_s F_s^{-1} w_f"
    tests:
      - "moose_app/test/tests/conversion_corrected_darcy/conversion_corrected_relative_flux_1d.i"
      - "moose_app/test/tests/phase_transforming_darcy/phase_transforming_relative_flux_1d.i"
      - "moose_app/test/tests/phase_transforming_darcy/tests including the nonpositive-resistance RunException"
      - "moose_app/test/tests/anisotropic_phase_transforming_darcy/anisotropic_phase_transforming_darcy_2d.i"
      - "moose_app/test/tests/anisotropic_phase_transforming_darcy/anisotropic_phase_transforming_darcy_bad_tensor.i"
      - "moose_app/test/tests/phase_momentum_models/full_phase_momentum_1d.i"
    templates:
      - "moose_app/input/templates/phase_transforming_darcy.i"
      - "moose_app/input/templates/anisotropic_phase_transforming_pressure_gradient.i.template"

  - id: black_oil_pvt_and_storage
    status: implemented_material_and_coupled_storage_balance_slice
    source:
      theory_manuscript:
        labels:
          - "eq:black_oil_storage_identifications"
          - "eq:black_oil_water_balance"
          - "eq:black_oil_oil_balance"
          - "eq:black_oil_gas_balance"
        sections:
          - "sections/correspondence_to_other_theories.tex"
      implementation_paper:
        labels: []
        sections:
          - "sections/scope.tex"
    role: "pressure-tabulated black-oil PVT closure and water, oil, and gas component storage on the solid reference configuration"
    moose_plan:
      variables:
        - "reference pressure"
        - "porosity"
        - "water saturation"
        - "gas saturation"
      kernels:
        - "ADEnrichedGalerkinScalarBalance"
      materials:
        - "ADBlackOilPVTMaterial"
      userobjects: []
      boundary_conditions: []
    assumptions_to_record:
      - "B_w, B_o, B_g, R_s, and optional water/oil/gas viscosities share a strictly increasing pressure grid and are piecewise linear on each interval"
      - "surface water, oil, and gas densities are positive constants"
      - "oil saturation is 1-S_w-S_g"
      - "the oil phase carries stock-tank oil and dissolved stock-tank gas according to R_s"
      - "the reference storage is J times the corresponding current-volume storage identification"
      - "the default out-of-range policy rejects pressure outside the table; clamp and linear extrapolation are explicit alternatives"
      - "compute_storage_rates is opt-in and requires a transient executioner because it consumes p_dot, phi_dot, S_w_dot, S_g_dot, and J_dot"
    tests:
      - "moose_app/test/tests/black_oil_pvt/black_oil_pvt_storage_1d.i"
      - "moose_app/test/tests/black_oil_pvt/black_oil_pvt_ad_jacobian_1d.i"
      - "moose_app/test/tests/black_oil_pvt/black_oil_storage_rate_1d.i"
      - "moose_app/test/tests/black_oil_pvt/black_oil_three_component_storage_balance_1d.i"
      - "moose_app/test/tests/black_oil_pvt/tests contract RunException cases"

  - id: spe_black_oil_benchmark_pvt
    status: coupled_q2_cg_eg_phase_appearance_verification_in_progress
    source:
      theory_manuscript:
        labels:
          - "eq:black_oil_storage_identifications"
          - "eq:black_oil_water_balance"
          - "eq:black_oil_oil_balance"
          - "eq:black_oil_gas_balance"
          - "eq:black_oil_darcy_flux"
        sections:
          - "sections/correspondence_to_other_theories.tex"
      implementation_paper:
        labels: []
        sections:
          - "sections/scope.tex"
    role: "SPE1 finite-deformation solid-reference benchmark with Q2 solid displacement and CG/EG black-oil flow"
    moose_plan:
      variables:
        - "Q2 Lagrange solid displacement"
        - "P1 continuous oil-pressure backbone plus P0 enrichment and reconstructed total pressure"
        - "P2 continuous water-saturation backbone plus P0 enrichment and physical reconstruction"
        - "P2 Bernstein gas-saturation backbone plus P0 enrichment and identity reconstruction"
        - "P1 continuous dissolved solution gas-oil ratio"
        - "P1 continuous tau backbone plus P0 enrichment and reconstructed total tau"
        - "element-local P2 monomial phase-transformation rate"
        - "separate continuous fluid and solid temperatures"
        - "continuous matrix-volume and porosity fields"
      kernels:
        - "ADReferenceSolidMomentum for finite-deformation solid-reference momentum"
        - "ADMaterialPropertyResidual for matrix balance, phase-volume closure, and gas-appearance admissibility"
        - "ADEnrichedGalerkinScalarBalance and ADEnrichedGalerkinScalarEnrichmentBalance for component storage and sources"
        - "ADEnrichedGalerkinFluxDG and ADEnrichedGalerkinSymmetryDG for EG interior-facet operators"
        - "BlackOilNodalWellControl for active completion sources and shared rate/BHP controls"
      materials:
        - "ADBlackOilBenchmarkPVTMaterial"
        - "ADStandardDarcyReferenceFluxMaterial"
        - "ADPhaseTauMaterialDerivative reconstructing current phase velocity from Q2 solid kinematics and reference relative mass flux"
        - "ADGeneralizedTransferWorkMaterial composing phase/component mu - psi + tau-offset transfer work"
      userobjects: []
      boundary_conditions:
        - "weak EG no-flow boundary operators"
      bounds:
        - "CoefficientBounds on every P2 Bernstein gas-saturation coefficient and ConstantBounds on its P0 enrichment under PETSc VI"
    assumptions_to_record:
      - "PVTW follows the ECLIPSE constant-compressibility and viscosibility formulas"
      - "PVDG uses its own pressure grid"
      - "PVTO stores saturated branch data and flattened pressure-dependent undersaturated branches indexed by R_s"
      - "S_g is complementary to R_s^sat(p_o)-R_s when equilibrium solution-gas transfer is enabled"
      - "SPE1 Case 1 uses DRSDT=0 and the irreversible undersaturated history branch, which permits exsolution while preventing redissolution above the history cap"
