# MOOSE implementation traceability notes.
# This file complements implementation_paper/equation_to_moose_map.yml with
# app-local object planning and implementation assumptions.

schema_version: 1
principles:
  - "Keep residual kernels small and traceable to named manuscript equations or reductions."
  - "Use AD materials for thermodynamic properties when possible."
  - "Keep EOS, phase equilibrium, tensor kinematics, pull-backs, and nontrivial state transformations explicit."
  - "Record every implementation closure, stabilization, and discretization choice that is not present in the theory manuscript."

object_families:
  kinematics:
    status: implemented_solid_reference_and_mobile_phase_history_slice
    likely_directories:
      - "include/materials"
      - "src/materials"
    manuscript_basis:
      - "solid-skeleton kinematics and pull-back sections"
    required_notes:
      - "reference/current configuration"
      - "Jacobian and deformation-gradient definitions"
    implemented_objects:
      - name: "PhaseRegistry"
        files:
          - "include/userobjects/PhaseRegistry.h"
          - "src/userobjects/PhaseRegistry.C"
        notes:
          - "registers an arbitrary positive number of unique input-deck phase names"
          - "identifies the registered phase whose map defines the reference configuration"
          - "rejects duplicate, malformed, and unregistered phase names"
          - "assigns reference, full, or relative_flux momentum formulation independently to every phase"
      - name: "ADSolidReferenceKinematics"
        files:
          - "include/materials/ADSolidReferenceKinematics.h"
          - "src/materials/ADSolidReferenceKinematics.C"
        manuscript_basis:
          - "eq:reference_relative_mass_flux"
          - "eq:solid_reference_flux_divergence"
        notes:
          - "computes F = I + Grad u, J = det F, F^{-1}, J F^{-1}, and J_dot = J tr(F_dot F^{-1})"
          - "uses only the active mesh-dimension displacement components and leaves inactive diagonal entries as identity"
          - "under transient execution, F_dot uses the AD current displacement gradient and the old gradient divided by dt so the summed component storage rate preserves displacement Jacobian coupling"
      - name: "ADPhaseHistoryKinematicsMaterial"
        files:
          - "include/materials/ADPhaseHistoryKinematicsMaterial.h"
          - "src/materials/ADPhaseHistoryKinematicsMaterial.C"
        manuscript_basis:
          - "eq:reference_relative_mass_flux"
          - "eq:implementation_phase_velocity_reconstruction"
          - "eq:fluid_material_derivative_on_solid_frame"
          - "eq:implementation_phase_velocity_gradient"
          - "eq:implementation_phase_history_kinematics"
        notes:
          - "requires any non-reference phase registered by PhaseRegistry"
          - "stores phase-history F_a and J_a on the solid reference mesh; these are not the solid pull-back map"
          - "computes l_a = Grad_X v_a F_s^{-1} and c_a = W_a / (J_s rho_a), with rho_a = phi_a rhobar_a the current bulk phase density"
          - "sets both c_a and l_a to zero when active_fraction is below active_tol, preserving inactive phase-history fields and avoiding division by vanished density"
      - name: "ADPhaseDeformationGradientHistory"
        files:
          - "include/kernels/ADPhaseDeformationGradientHistory.h"
          - "src/kernels/ADPhaseDeformationGradientHistory.C"
        manuscript_basis:
          - "eq:fluid_material_derivative_on_solid_frame"
          - "eq:implementation_phase_deformation_gradient_history"
          - "eq:implementation_phase_deformation_gradient_residual"
        notes:
          - "residual for one row/column component of F_a for any registered mobile phase on the solid reference mesh"
          - "includes the phase material derivative term c_a dot Grad_X F_a"
      - name: "ADPhaseJacobianHistory"
        files:
          - "include/kernels/ADPhaseJacobianHistory.h"
          - "src/kernels/ADPhaseJacobianHistory.C"
        manuscript_basis:
          - "eq:fluid_material_derivative_on_solid_frame"
          - "eq:implementation_phase_jacobian_history"
          - "eq:implementation_phase_jacobian_residual"
        notes:
          - "residual for J_o, J_g, or J_w on the solid reference mesh"
          - "evolves J_a with J_a tr(l_a) and includes c_a dot Grad_X J_a"
      - name: "ADRegisteredPhaseMomentum"
        files:
          - "include/kernels/ADRegisteredPhaseMomentum.h"
          - "src/kernels/ADRegisteredPhaseMomentum.C"
        manuscript_basis:
          - "eq:el_mom_f_simplified"
          - "eq:implementation_full_phase_momentum_residual"
        notes:
          - "requires a phase registered with momentum model full"
          - "uses D_a v_a / Dt = partial_t v_a|_X + [F_s^{-1}(v_a-v_s)] dot Grad_X v_a"
          - "pulls all current-volume forces and optional Cauchy stress to the reference-phase mesh"
          - "supports additional registered phase-interaction forces and conversion insertion"
          - "pressure_potential_enrichment supplies the P0 enrichment for Q2/EG momentum decks, so the force uses Grad_X(p_E + p_E,enr)"
          - "include_capillary_pressure defaults false; true requires phase gamma_a and uses Grad_X(p_E + p_E,enr + gamma_a + gamma_a,enr) when capillary enrichment is supplied"
      - name: "ADRegisteredPhaseMomentumTractionBC"
        files:
          - "include/bcs/ADRegisteredPhaseMomentumTractionBC.h"
          - "src/bcs/ADRegisteredPhaseMomentumTractionBC.C"
        notes:
          - "prescribes a full-phase traction component per unit reference area"

  thermodynamics:
    status: implemented_user_helmholtz_eos_and_reduced_ideal_mixture_regression
    likely_directories:
      - "include/materials"
      - "src/materials"
      - "include/userobjects"
      - "src/userobjects"
    manuscript_basis:
      - "eq:component_partial_density_representation"
      - "eq:MC_absolute_neutral_component_potential"
      - "eq:MC_fluid_legendre_relation"
      - "eq:MC_neutral_component_euler_identity"
      - "reversible thermodynamic restrictions"
    required_notes:
      - "state set"
      - "held-fixed variables"
      - "derivative source: parsed expression, compiled material, tabulated object, or EOS solve"
    implemented_objects:
      - name: "ADHelmholtzEOSClosureMaterial"
        files:
          - "include/materials/ADHelmholtzEOSClosureMaterial.h"
          - "src/materials/ADHelmholtzEOSClosureMaterial.C"
        manuscript_basis:
          - "eq:MC_absolute_neutral_component_potential"
          - "eq:MC_fluid_legendre_relation"
          - "eq:MC_neutral_component_euler_identity"
          - "eq:implementation_eos_chemical_potential"
          - "eq:implementation_eos_pressure"
          - "eq:implementation_eos_entropy"
        notes:
          - "supports any phase name registered by the input-deck PhaseRegistry"
          - "consumes a user-supplied Helmholtz density and derivatives generated by ADDerivativeParsedMaterial"
          - "uses partial constituent densities per unit current phase volume as independent composition variables"
          - "derives chemical potentials, pressure, entropy density, intrinsic density, bulk phase density, and specific Helmholtz energy"
          - "derivative_order = 2 exposes the consistent composition/temperature Hessian for Newton coupling"
      - name: "ADReferenceComponentStorageMaterial"
        files:
          - "include/materials/ADReferenceComponentStorageMaterial.h"
          - "src/materials/ADReferenceComponentStorageMaterial.C"
        manuscript_basis:
          - "eq:component_partial_density_representation"
          - "eq:solid_reference_fluid_component_balance"
        notes:
          - "computes rho_xi^alpha = phi_xi rhobar_xi eta_xi^alpha in the current configuration"
          - "computes reference_component_storage = J rho_xi^alpha for reference-volume component storage"
          - "does not yet perform an EOS, phase split, chemical-potential derivative, or vanishing-phase regularization"
      - name: "ADIdealMixtureFluidEOSMaterial"
        files:
          - "include/materials/ADIdealMixtureFluidEOSMaterial.h"
          - "src/materials/ADIdealMixtureFluidEOSMaterial.C"
        manuscript_basis:
          - "eq:component_partial_density_representation"
          - "eq:MC_absolute_neutral_component_potential"
          - "eq:MC_fluid_legendre_relation"
          - "eq:MC_neutral_component_euler_identity"
        notes:
          - "computes rhobar_f from a slightly compressible pressure law using pressure as a primitive variable"
          - "pressure_enrichment supplies the P0 EG pressure enrichment when the EOS is used in coupled hierarchy decks"
          - "computes J phi_f rhobar_f eta_f^alpha for each supplied component mass fraction"
          - "computes a neutral ideal-mixture Helmholtz specialization and hat_mu_f^alpha as the fixed-volume constituent-density derivative"
          - "exposes rhobar_f^2 d psi_vol / d rhobar_f - p_f and the mass-fraction sum as diagnostics"
          - "holds phase volume fraction, temperature, other component densities, and kinematic/internal fields fixed; electric enthalpy is omitted in this neutral reduction"
          - "uses the positive-composition log(eta_f^alpha) ideal-mixture formula and rejects mass fractions that do not sum to one"
          - "does not yet perform phase equilibrium, phase appearance/disappearance, tabulated PVT, or CALPHAD/EOS flash solves"
      - name: "ADTwoPhaseConstantKEquilibriumMaterial"
        files:
          - "include/materials/ADTwoPhaseConstantKEquilibriumMaterial.h"
          - "src/materials/ADTwoPhaseConstantKEquilibriumMaterial.C"
        manuscript_basis:
          - "eq:mass_fraction_constraint"
          - "eq:phase_volume_fraction"
          - "eq:volume_fraction_constraint"
          - "eq:component_partial_density_representation"
          - "eq:classical_compositional_closure_set"
          - "eq:classical_phase_equilibrium_mu"
          - "eq:implementation_component_density_partition"
          - "eq:implementation_volume_partition"
          - "eq:implementation_mass_fraction_partition"
          - "eq:implementation_phase_material_storage"
        notes:
          - "implements a restricted bounded two-phase, two-component constant-K split"
          - "computes phase mass split, saturations, phase volume fractions, phase compositions, equilibrium residuals, and total reference component storages"
          - "uses an active interior split for 0 < beta < 1 and endpoint branches for one present phase plus one incipient inactive phase"
          - "branches on the raw unbounded beta value; AD propagates through the selected branch"
          - "does not yet implement full flash, pressure-dependent K-values, capillary pressure, relative permeability, or a smooth complementarity formulation"

  transport:
    status: implemented_reference_darcy_and_charged_nonisothermal_slices
    likely_directories:
      - "include/kernels"
      - "src/kernels"
      - "include/fvkernels"
      - "src/fvkernels"
    manuscript_basis:
      - "component and phase mass balances"
      - "eq:MC_energy_balance"
      - "eq:MC_transport_force_gauge_objectivity"
      - "eq:MC_relative_transport_closures"
      - "eq:standard_darcy_mass_flux_limit"
      - "eq:reference_relative_mass_flux"
      - "eq:pulled_back_modified_permeability"
    required_notes:
      - "FE or FV variable choice"
      - "flux law"
      - "stabilization/upwinding"
      - "neutral-potential thermal gradient plus direct electric-field force"
      - "direct electric-field work on the relative charge flux"
      - "exclude isolated electric-potential-weighted charge fluxes"
      - "electric potential gauge test"
    implemented_objects:
      - name: "ADReferenceFluidComponentMaterial"
        files:
          - "include/materials/ADReferenceFluidComponentMaterial.h"
          - "src/materials/ADReferenceFluidComponentMaterial.C"
        manuscript_basis:
          - "eq:reference_relative_mass_flux"
          - "eq:solid_reference_fluid_component_balance"
        notes:
          - "computes W_f = J F^{-1} w_f"
          - "computes eta_f^alpha W_f + J F^{-1}(j_disp^alpha + j_diff^alpha)"
          - "computes the J-weighted current-volume source"
      - name: "ADReferenceFluidComponentBalance"
        files:
          - "include/kernels/ADReferenceFluidComponentBalance.h"
          - "src/kernels/ADReferenceFluidComponentBalance.C"
        manuscript_basis:
          - "eq:solid_reference_flux_divergence"
          - "eq:solid_reference_fluid_component_balance"
          - "eq:fluid_component_residual"
        notes:
          - "continuous Galerkin residual for storage time derivative, reference-divergence component flux, and source"
      - name: "ADReferenceFluidComponentFluxBC"
        files:
          - "include/bcs/ADReferenceFluidComponentFluxBC.h"
          - "src/bcs/ADReferenceFluidComponentFluxBC.C"
        manuscript_basis:
          - "eq:fluid_component_residual"
        notes:
          - "natural outward reference phase-flux boundary contribution multiplied by component mass fraction"
      - name: "ADStandardDarcyReferenceFluxMaterial"
        files:
          - "include/materials/ADStandardDarcyReferenceFluxMaterial.h"
          - "src/materials/ADStandardDarcyReferenceFluxMaterial.C"
        manuscript_basis:
          - "eq:standard_darcy_mass_flux_limit"
          - "eq:black_oil_darcy_flux"
          - "eq:reference_relative_mass_flux"
          - "eq:pulled_back_modified_permeability"
        notes:
          - "computes a reduced standard Darcy relative mass flux on the solid reference configuration"
          - "uses scalar intrinsic permeability, constant or optional AD material viscosity, optional AD relative permeability, pressure gradient, optional P0 pressure enrichment gradient, intrinsic density, gravity, and the AD solid pull-back"
          - "include_acceleration defaults false for the negligible-inertia reduction; true requires phase_acceleration and uses g-a_f"
          - "include_capillary_pressure defaults false; true requires phase gamma_f and uses Grad_X(p_E + p_E,enr + gamma_f + gamma_f,enr) when pressure/capillary enrichments are supplied"
          - "can consume intrinsic density from either a coupled variable or an AD EOS material property"
          - "accepts supplied phase capillary and relative-permeability properties but excludes their constitutive laws, phase equilibrium, electrochemical forces, thermal forces, and conversion-induced driving terms"
      - name: "ADBlackOilPVTMaterial"
        files:
          - "include/materials/ADBlackOilPVTMaterial.h"
          - "src/materials/ADBlackOilPVTMaterial.C"
        manuscript_basis:
          - "eq:black_oil_storage_identifications"
          - "eq:black_oil_water_balance"
          - "eq:black_oil_oil_balance"
          - "eq:black_oil_gas_balance"
          - "eq:solid_reference_fluid_component_balance"
        notes:
          - "linearly interpolates pressure-tabulated B_w, B_o, B_g, R_s, and optional water/oil/gas viscosities while preserving the active table slope in the AD graph"
          - "computes phase intrinsic densities, oil-phase component mass fractions, oil saturation, and current- and solid-reference component storage"
          - "accepts either a coupled pressure variable or a reconstructed-total AD pressure and pressure-rate material-property pair, preserving backbone and enrichment Jacobian coupling"
          - "when compute_storage_rates=true in a transient solve, provides the full chain-rule material time rate of each J-weighted reference component storage for pressure-saturation balance kernels"
          - "supports explicit error, clamp, and linear-extrapolation policies outside the supplied pressure interval"
          - "supplies storage, storage-rate, PVT, and optional phase-viscosity properties; component-balance kernels, phase fluxes, capillary pressure, relative permeability, and wells remain separate objects"
      - name: "ADBlackOilBenchmarkPVTMaterial"
        files:
          - "include/materials/ADBlackOilBenchmarkPVTMaterial.h"
          - "src/materials/ADBlackOilBenchmarkPVTMaterial.C"
        manuscript_basis:
          - "eq:black_oil_storage_identifications"
          - "eq:black_oil_water_balance"
          - "eq:black_oil_oil_balance"
          - "eq:black_oil_gas_balance"
          - "eq:black_oil_darcy_flux"
        notes:
          - "evaluates ECLIPSE-style PVTW constant-compressibility water, separate-grid PVDG gas, and ragged PVTO oil branches with AD pressure and dissolved-R_s dependence"
          - "treats dissolved R_s as an independent coupled state and exposes saturated R_s, the nonnegative undersaturation gap, and a Fischer-Burmeister gas-saturation complementarity residual"
          - "uses the saturated PVTO curve when gas is active and an undersaturated PVTO branch when gas is absent"
          - "declares phase viscosity, intrinsic-density, and J-weighted water/oil/gas component-storage properties for the benchmark flux and balance objects"
          - "the SPE1 initial and active-gas PVT states are regression tested, and ADMaterialPropertyResidual solves the active-gas complementarity equation for dissolved R_s; coupling with the full transient component system remains open"
      - name: "ADBlackOilPeacemanWellMaterial"
        files:
          - "include/materials/ADBlackOilPeacemanWellMaterial.h"
          - "src/materials/ADBlackOilPeacemanWellMaterial.C"
        manuscript_basis:
          - "eq:black_oil_water_balance"
          - "eq:black_oil_oil_balance"
          - "eq:black_oil_gas_balance"
          - "eq:black_oil_storage_identifications"
        notes:
          - "computes BHP-controlled Peaceman phase reservoir rates from phase pressures and AD well mobilities on a completion block"
          - "converts phase rates through B_w, B_o, B_g, and R_s to water, stock-tank oil, and stock-tank gas surface rates"
          - "exposes reference-volume component sources with production negative and injection positive for direct use by enriched-Galerkin component balances"
          - "scheduled rate controls, BHP/rate switching, completion geometry import, and multi-completion aggregation remain separate well-control objects"
      - name: "ADBlackOilCapillaryPressureMaterial"
        files:
          - "include/materials/ADBlackOilCapillaryPressureMaterial.h"
          - "src/materials/ADBlackOilCapillaryPressureMaterial.C"
        manuscript_basis:
          - "eq:black_oil_capillary_pressure_closures"
        notes:
          - "reconstructs water and gas pressures from an oil reference pressure using the manuscript water-oil and gas-oil signs"
          - "uses fixed-history tabulated p_cow(S_w) and p_cgo(S_g) curves with AD interpolation"
          - "optionally includes nonnegative diagonal T_ow S_w_dot and T_go S_g_dot dynamic-capillary terms in transient solves"
          - "history-state evolution for reversal and trapping remains a separate constitutive object"
      - name: "ADBlackOilRelativePermeabilityMaterial"
        files:
          - "include/materials/ADBlackOilRelativePermeabilityMaterial.h"
          - "src/materials/ADBlackOilRelativePermeabilityMaterial.C"
        manuscript_basis:
          - "eq:black_oil_darcy_flux"
        notes:
          - "interpolates SWOF/SGOF-style water, gas, oil-water, and oil-gas relative-permeability tables with AD slopes"
          - "combines the two oil curves with the default ECLIPSE/OPM saturation-weighted three-phase rule and its near-connate regularization"
          - "declares phase relative-permeability properties consumed directly by ADStandardDarcyReferenceFluxMaterial"
          - "table curves represent a fixed history state; hysteresis updates remain separate"
      - name: "ADReferenceFluidComponentFluxMaterial"
        files:
          - "include/materials/ADReferenceFluidComponentFluxMaterial.h"
          - "src/materials/ADReferenceFluidComponentFluxMaterial.C"
        manuscript_basis:
          - "eq:reference_relative_mass_flux"
          - "eq:solid_reference_fluid_component_balance"
          - "eq:fluid_component_residual"
        notes:
          - "assembles eta_f^alpha W_f + J F^{-1}(j_disp^alpha + j_diff^alpha) from a material-provided phase relative flux"
          - "can add an AD current component extra-flux material property before pull-back"
          - "computes the J-weighted current-volume component source for the residual kernel"
      - name: "ADRegisteredPhaseComponentFluxMaterial"
        files:
          - "include/materials/ADRegisteredPhaseComponentFluxMaterial.h"
          - "src/materials/ADRegisteredPhaseComponentFluxMaterial.C"
        manuscript_basis:
          - "eq:reference_relative_mass_flux"
          - "eq:solid_reference_fluid_component_balance"
          - "eq:fluid_component_residual"
        notes:
          - "assembles a component reference flux from an arbitrary registered phase list"
          - "uses phase mass fractions, phase reference relative mass fluxes, optional phase-active flags, and optional AD current extra-flux material properties"
          - "the verified 1D, 2D, and 3D registered-phase component-balance decks use Q2 prescribed solid displacement, P1+P0 EG-like oil/gas/water pressure drivers, and material-property consumption of each reconstructed total pressure"
      - name: "ADChargedNonisothermalComponentFluxMaterial"
        files:
          - "include/materials/ADChargedNonisothermalComponentFluxMaterial.h"
          - "src/materials/ADChargedNonisothermalComponentFluxMaterial.C"
        manuscript_basis:
          - "eq:MC_transport_force_gauge_objectivity"
          - "eq:MC_relative_transport_closures"
        notes:
          - "computes a current component flux from neutral-potential, electric-potential, and temperature gradients"
          - "uses only Grad(phi) for the electric contribution, so electric-potential gauge shifts do not enter the force"
          - "reports the transport force, current component flux, charge flux, and direct electric-field work on that charge flux"
          - "validated in one, two, and three dimensions by registered-phase component-balance regressions"
      - name: "ADTwoPhaseSplitComponentFluxMaterial"
        files:
          - "include/materials/ADTwoPhaseSplitComponentFluxMaterial.h"
          - "src/materials/ADTwoPhaseSplitComponentFluxMaterial.C"
        manuscript_basis:
          - "eq:reference_relative_mass_flux"
          - "eq:solid_reference_fluid_component_balance"
          - "eq:fluid_component_residual"
          - "eq:implementation_mass_fraction_partition"
        notes:
          - "assembles a selected component reference flux from two phase-specific W_a fields and split-derived phase compositions"
          - "validated with a nonzero split-derived Darcy flux balance; current object is still two-phase and must be generalized before four mobile phase transport"

