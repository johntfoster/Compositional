        files:
          - "include/materials/ADPhaseTauMaterialDerivative.h"
          - "src/materials/ADPhaseTauMaterialDerivative.C"
        manuscript_basis:
          - "eq:MC_phase_reference_transfer_work_recovery"
          - "eq:MC_transfer_work_full_recovery"
          - "eq:implementation_fluid_transfer_work_recovery"
        notes:
          - "computes D_xi tau/Dt on the solid reference mesh"
          - "uses c_xi = W_xi/(J rho_xi) for mobile phases, with rho_xi the current bulk phase density"
          - "reports the transfer offset D_xi tau/Dt - |v_xi|^2/2"
