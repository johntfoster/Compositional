# MOOSE implementation traceability notes.
# This file complements implementation_paper/equation_to_moose_map.yml with
# app-local object planning and implementation assumptions.

schema_version: 1
principles:
  - "Keep residual kernels small and traceable to named manuscript equations or reductions."
  - "Use AD materials for thermodynamic properties when possible."
  - "Keep EOS, phase equilibrium, tensor kinematics, pull-backs, and nontrivial state transformations explicit."
  - "Record every implementation closure, stabilization, and discretization choice that is not present in the theory manuscript."

object_families:
  kinematics:
    status: implemented_solid_reference_and_mobile_phase_history_slice
    likely_directories:
      - "include/materials"
      - "src/materials"
    manuscript_basis:
      - "solid-skeleton kinematics and pull-back sections"
    required_notes:
      - "reference/current configuration"
      - "Jacobian and deformation-gradient definitions"
    implemented_objects:
      - name: "PhaseRegistry"
        files:
          - "include/userobjects/PhaseRegistry.h"
          - "src/userobjects/PhaseRegistry.C"
        notes:
          - "registers an arbitrary positive number of unique input-deck phase names"
          - "identifies the registered phase whose map defines the reference configuration"
          - "rejects duplicate, malformed, and unregistered phase names"
          - "assigns reference, full, or relative_flux momentum formulation independently to every phase"
      - name: "ADSolidReferenceKinematics"
        files:
          - "include/materials/ADSolidReferenceKinematics.h"
          - "src/materials/ADSolidReferenceKinematics.C"
        manuscript_basis:
          - "eq:reference_relative_mass_flux"
          - "eq:solid_reference_flux_divergence"
        notes:
          - "computes F = I + Grad u, J = det F, F^{-1}, J F^{-1}, and J_dot = J tr(F_dot F^{-1})"
          - "uses only the active mesh-dimension displacement components and leaves inactive diagonal entries as identity"
          - "under transient execution, F_dot uses the AD current displacement gradient and the old gradient divided by dt so the summed component storage rate preserves displacement Jacobian coupling"
      - name: "ADSolidDistensionEvolution"
        files:
          - "include/kernels/ADSolidDistensionEvolution.h"
          - "src/kernels/ADSolidDistensionEvolution.C"
        manuscript_basis:
          - "eq:MC_solid_distension_evolution"
        notes:
          - "implements a_dot/a - J_dot/J - rhobar_dot/rhobar = 0"
          - "consumes configurable J and J_dot AD material properties from Cartesian or axisymmetric finite-deformation kinematics"
          - "retains off-diagonal AD coupling to every active Q2 displacement component and rejects nonpositive a, rhobar, or J"
          - "passes the 1D/2D/3D/RZ stitched hierarchy with the conserved solid constituent storage and source path"
      - name: "ADSolidPhaseMassVolumeMaterial"
        files:
          - "include/materials/ADSolidPhaseMassVolumeMaterial.h"
          - "src/materials/ADSolidPhaseMassVolumeMaterial.C"
        manuscript_basis:
          - "eq:solid_reference_solid_component_balance"
          - "eq:MC_solid_distension_mass_relation"
        notes:
          - "accepts constant or coupled current intrinsic density and computes the exact rate of J phi_s rhobar_s"
          - "reconstructs phi_s and its rate from conserved solid-reference storage while retaining AD coupling through J and rhobar_s"
          - "consumes the current-volume solid component source with the manuscript J multiplier"
          - "reports a_s phi_s rhobar_s0 - J phi_s rhobar_s as the integrated distension-mass audit"
          - "the stitched 1D/2D/3D/RZ solve, off-diagonal Jacobian, and rho/J rejection tests pass"
      - name: "ADPhaseHistoryKinematicsMaterial"
        files:
          - "include/materials/ADPhaseHistoryKinematicsMaterial.h"
          - "src/materials/ADPhaseHistoryKinematicsMaterial.C"
        manuscript_basis:
          - "eq:reference_relative_mass_flux"
          - "eq:implementation_phase_velocity_reconstruction"
          - "eq:fluid_material_derivative_on_solid_frame"
          - "eq:implementation_phase_velocity_gradient"
          - "eq:implementation_phase_history_kinematics"
        notes:
          - "requires any non-reference phase registered by PhaseRegistry"
          - "stores phase-history F_a and J_a on the solid reference mesh; these are not the solid pull-back map"
          - "computes l_a = Grad_X v_a F_s^{-1} and c_a = W_a / (J_s rho_a), with rho_a = phi_a rhobar_a the current bulk phase density"
          - "sets both c_a and l_a to zero when active_fraction is below active_tol, preserving inactive phase-history fields and avoiding division by vanished density"
      - name: "ADPhaseDeformationGradientHistory"
        files:
          - "include/kernels/ADPhaseDeformationGradientHistory.h"
          - "src/kernels/ADPhaseDeformationGradientHistory.C"
        manuscript_basis:
          - "eq:fluid_material_derivative_on_solid_frame"
          - "eq:implementation_phase_deformation_gradient_history"
          - "eq:implementation_phase_deformation_gradient_residual"
        notes:
          - "residual for one row/column component of F_a for any registered mobile phase on the solid reference mesh"
          - "includes the phase material derivative term c_a dot Grad_X F_a"
      - name: "ADPhaseJacobianHistory"
        files:
          - "include/kernels/ADPhaseJacobianHistory.h"
          - "src/kernels/ADPhaseJacobianHistory.C"
        manuscript_basis:
          - "eq:fluid_material_derivative_on_solid_frame"
          - "eq:implementation_phase_jacobian_history"
          - "eq:implementation_phase_jacobian_residual"
        notes:
          - "residual for J_o, J_g, or J_w on the solid reference mesh"
          - "evolves J_a with J_a tr(l_a) and includes c_a dot Grad_X J_a"
      - name: "ADRegisteredPhaseMomentum"
        files:
          - "include/kernels/ADRegisteredPhaseMomentum.h"
          - "src/kernels/ADRegisteredPhaseMomentum.C"
        manuscript_basis:
          - "eq:el_mom_f_simplified"
          - "eq:implementation_full_phase_momentum_residual"
        notes:
          - "requires a phase registered with momentum model full"
          - "uses D_a v_a / Dt = partial_t v_a|_X + [F_s^{-1}(v_a-v_s)] dot Grad_X v_a"
          - "pulls all current-volume forces and optional Cauchy stress to the reference-phase mesh"
          - "supports additional registered phase-interaction forces and conversion insertion"
          - "pressure_potential_enrichment supplies the P0 enrichment for Q2/EG momentum decks, so the force uses Grad_X(p_E + p_E,enr)"
          - "include_capillary_pressure defaults false; true requires phase gamma_a and uses Grad_X(p_E + p_E,enr + gamma_a + gamma_a,enr) when capillary enrichment is supplied"
      - name: "ADRegisteredPhaseMomentumTractionBC"
        files:
          - "include/bcs/ADRegisteredPhaseMomentumTractionBC.h"
          - "src/bcs/ADRegisteredPhaseMomentumTractionBC.C"
        notes:
          - "prescribes a full-phase traction component per unit reference area"

  thermodynamics:
    status: implemented_user_helmholtz_eos_and_reduced_ideal_mixture_regression
    likely_directories:
      - "include/materials"
      - "src/materials"
      - "include/userobjects"
      - "src/userobjects"
    manuscript_basis:
      - "eq:component_partial_density_representation"
      - "eq:MC_absolute_neutral_component_potential"
      - "eq:MC_fluid_legendre_relation"
      - "eq:MC_neutral_component_euler_identity"
      - "reversible thermodynamic restrictions"
    required_notes:
      - "state set"
      - "held-fixed variables"
      - "derivative source: parsed expression, compiled material, tabulated object, or EOS solve"
    implemented_objects:
      - name: "ADHelmholtzEOSClosureMaterial"
        files:
          - "include/materials/ADHelmholtzEOSClosureMaterial.h"
          - "src/materials/ADHelmholtzEOSClosureMaterial.C"
        manuscript_basis:
          - "eq:MC_absolute_neutral_component_potential"
          - "eq:MC_fluid_legendre_relation"
          - "eq:MC_neutral_component_euler_identity"
          - "eq:implementation_eos_chemical_potential"
          - "eq:implementation_eos_pressure"
          - "eq:implementation_eos_entropy"
        notes:
          - "supports any phase name registered by the input-deck PhaseRegistry"
          - "consumes a user-supplied Helmholtz density and derivatives generated by ADDerivativeParsedMaterial"
          - "uses partial constituent densities per unit current phase volume as independent composition variables"
          - "derives chemical potentials, pressure, entropy density, intrinsic density, bulk phase density, and specific Helmholtz energy"
          - "derivative_order = 2 exposes the consistent composition/temperature Hessian for Newton coupling"
      - name: "ADHelmholtzElectricEnthalpyEOSMaterial"
        files:
          - "include/materials/ADHelmholtzElectricEnthalpyEOSMaterial.h"
          - "src/materials/ADHelmholtzElectricEnthalpyEOSMaterial.C"
        manuscript_basis:
          - "eq:MC_phase_pressure_definitions"
          - "eq:MC_fluid_pressure_definition"
          - "eq:MC_solid_pressure_definition"
          - "eq:MC_absolute_neutral_component_potential"
        notes:
          - "derives the phase pressure from the material Helmholtz-density Euler term plus the electric-enthalpy constituent-density derivatives for any registered fluid or solid phase"
          - "reports the material and dielectric pressure contributions separately together with absolute neutral potentials, intrinsic and bulk phase densities, specific Helmholtz and internal energies, and electrical state-rate coefficients"
          - "the analytic electric_enthalpy regression verifies total pressure 4 as the sum of material pressure -8 and dielectric correction 12"
      - name: "ADTheoryCompositionProjectionMaterial"
        files:
          - "include/materials/ADTheoryCompositionProjectionMaterial.h"
          - "src/materials/ADTheoryCompositionProjectionMaterial.C"
        manuscript_basis:
          - "eq:phase_pressure_storage"
          - "eq:el_eta_constraint"
          - "eq:Pi_componentwise"
          - "eq:pi_difference_system"
          - "eq:MC_fluid_composition_projection"
          - "eq:MC_solid_composition_projection"
          - "eq:MC_neutral_component_euler_identity"
        notes:
          - "implements the current theory Eqs. (182)--(183), not a traditional fugacity-equality flash"
          - "assembles rho_xi d psi_xi/d eta, phi_xi d omega_xi^+/d eta, and any independently supplied solid stress-map corrections"
          - "recover mode algebraically evaluates Pi_xi and every pi_xi^alpha from the N-1 difference system and phase-pressure sum without adding primary fields"
          - "coupled mode exposes the N-1 projection residuals and pressure-storage residual for an explicit AD Newton solve"
          - "reports the mass-fraction normalization residual, exact specific storage work pi/(phi rhobar eta), and absolute neutral component potentials from the manuscript Euler identity"
          - "the exact reference-component specific storage work is consumed directly by ADTauEvolutionMaterial; no approximate pressure-work reconstruction is permitted"
          - "composition physics is opt-in and this object is absent from noncompositional input hierarchies"
          - "the focused analytic and coupled-Newton regressions pass in theory_composition_projection"
      - name: "ADCompositionStressMapCorrectionMaterial"
        files:
          - "include/materials/ADCompositionStressMapCorrectionMaterial.h"
          - "src/materials/ADCompositionStressMapCorrectionMaterial.C"
        manuscript_basis:
          - "eq:MC_solid_composition_projection"
        notes:
          - "assembles one selectable -tr[C (dG0/d eta_alpha) G0^{-1}] contribution at a time"
          - "separate instances represent the distension A0 and true-deformation Fbar0 terms, preserving input-deck modularity"
      - name: "ADRegisteredPhaseFlashMaterial"
        scope: "traditional_comparison_only"
        notes:
          - "consumes prescribed phase amounts and compositions and reports conventional active-phase pressure/chemical-potential equality residuals"
          - "does not implement the manuscript Eqs. (182)--(183), storage multipliers, tau evolution, or generalized transfer work"
          - "excluded from the manuscript-theory hierarchy and retained only for matched comparison runs"
      - name: "ADReferenceComponentStorageMaterial"
        files:
          - "include/materials/ADReferenceComponentStorageMaterial.h"
          - "src/materials/ADReferenceComponentStorageMaterial.C"
        manuscript_basis:
          - "eq:component_partial_density_representation"
          - "eq:solid_reference_fluid_component_balance"
        notes:
          - "computes rho_xi^alpha = phi_xi rhobar_xi eta_xi^alpha in the current configuration"
          - "computes reference_component_storage = J rho_xi^alpha for reference-volume component storage"
          - "does not yet perform an EOS, phase split, chemical-potential derivative, or vanishing-phase regularization"
      - name: "ADIdealMixtureFluidEOSMaterial"
        files:
          - "include/materials/ADIdealMixtureFluidEOSMaterial.h"
          - "src/materials/ADIdealMixtureFluidEOSMaterial.C"
        manuscript_basis:
          - "eq:component_partial_density_representation"
          - "eq:MC_absolute_neutral_component_potential"
          - "eq:MC_fluid_legendre_relation"
          - "eq:MC_neutral_component_euler_identity"
        notes:
          - "computes rhobar_f from a slightly compressible pressure law using pressure as a primitive variable"
          - "pressure_enrichment supplies the P0 EG pressure enrichment when the EOS is used in coupled hierarchy decks"
          - "computes J phi_f rhobar_f eta_f^alpha for each supplied component mass fraction"
          - "computes a neutral ideal-mixture Helmholtz specialization and hat_mu_f^alpha as the fixed-volume constituent-density derivative"
          - "exposes rhobar_f^2 d psi_vol / d rhobar_f - p_f and the mass-fraction sum as diagnostics"
          - "holds phase volume fraction, temperature, other component densities, and kinematic/internal fields fixed; electric enthalpy is omitted in this neutral reduction"
          - "uses the positive-composition log(eta_f^alpha) ideal-mixture formula and rejects mass fractions that do not sum to one"
          - "the quantitative 1D EDGE3/Q2 plus reconstructed P1+P0 EG acceptance leaf closes pressure and both absolute neutral component potentials, consumes EOS intrinsic density in standard Darcy/reference component fluxes, and solves both explicitly named direct summed Eq. (32) variables with maximum required error 1.528727e-13"
          - "does not yet perform phase equilibrium, phase appearance/disappearance, tabulated PVT, or CALPHAD/EOS flash solves"
      - name: "ADTwoPhaseConstantKEquilibriumMaterial"
        files:
          - "include/materials/ADTwoPhaseConstantKEquilibriumMaterial.h"
          - "src/materials/ADTwoPhaseConstantKEquilibriumMaterial.C"
        manuscript_basis:
          - "eq:mass_fraction_constraint"
          - "eq:phase_volume_fraction"
          - "eq:volume_fraction_constraint"
          - "eq:component_partial_density_representation"
          - "eq:classical_compositional_closure_set"
          - "eq:classical_phase_equilibrium_mu"
          - "eq:implementation_component_density_partition"
          - "eq:implementation_volume_partition"
          - "eq:implementation_mass_fraction_partition"
          - "eq:implementation_phase_material_storage"
        notes:
          - "implements a restricted bounded two-phase, two-component constant-K split"
          - "computes phase mass split, saturations, phase volume fractions, phase compositions, equilibrium residuals, and total reference component storages"
          - "uses an active interior split for 0 < beta < 1 and endpoint branches for one present phase plus one incipient inactive phase"
          - "branches on the raw unbounded beta value; AD propagates through the selected branch"
          - "does not yet implement full flash, pressure-dependent K-values, capillary pressure, relative permeability, or a smooth complementarity formulation"

  transport:
