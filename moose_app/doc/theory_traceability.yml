          - "eq:black_oil_water_balance"
          - "eq:black_oil_oil_balance"
          - "eq:black_oil_gas_balance"
          - "eq:solid_reference_fluid_component_balance"
        notes:
          - "linearly interpolates pressure-tabulated B_w, B_o, B_g, R_s, and optional water/oil/gas viscosities while preserving the active table slope in the AD graph"
          - "computes phase intrinsic densities, oil-phase component mass fractions, oil saturation, and current- and solid-reference component storage"
          - "accepts either a coupled pressure variable or a reconstructed-total AD pressure and pressure-rate material-property pair, preserving backbone and enrichment Jacobian coupling"
          - "when compute_storage_rates=true in a transient solve, provides the full chain-rule material time rate of each J-weighted reference component storage for pressure-saturation balance kernels"
          - "supports explicit error, clamp, and linear-extrapolation policies outside the supplied pressure interval"
          - "supplies storage, storage-rate, PVT, and optional phase-viscosity properties; component-balance kernels, phase fluxes, capillary pressure, relative permeability, and wells remain separate objects"
      - name: "ADBlackOilBenchmarkPVTMaterial"
        files:
          - "include/materials/ADBlackOilBenchmarkPVTMaterial.h"
          - "src/materials/ADBlackOilBenchmarkPVTMaterial.C"
        manuscript_basis:
          - "eq:black_oil_storage_identifications"
          - "eq:black_oil_water_balance"
          - "eq:black_oil_oil_balance"
          - "eq:black_oil_gas_balance"
          - "eq:black_oil_darcy_flux"
        notes:
          - "evaluates ECLIPSE-style PVTW constant-compressibility water, separate-grid PVDG gas, and ragged PVTO oil branches with AD pressure and dissolved-R_s dependence"
          - "treats dissolved R_s as an independent coupled state and exposes saturated R_s, the nonnegative undersaturation gap, and a Fischer-Burmeister gas-saturation complementarity residual"
          - "uses the saturated PVTO curve when gas is active under equilibrium transfer, while an explicit switch retains the undersaturated pressure-and-history-limited branch for DRSDT=0 benchmark evolution"
          - "declares phase viscosity, intrinsic-density, J-weighted water/oil/gas component-storage, and exact chain-rule reference-storage-rate properties for the benchmark flux and balance objects"
          - "exposes both the actual dissolved R_s state and saturated R_s so DRSDT=0 well sources use the history state while equilibrium-transfer closures use the saturated state"
          - "storage rates include PVTW, PVDG, ragged PVTO, dissolved R_s, porosity, saturation, and reference-J rates on the selected phase branch"
          - "the SPE1 initial and active-gas equilibrium PVT states are regression tested, ADMaterialPropertyResidual solves the equilibrium active-gas complementarity equation, and the isolated DRSDT=0 history regression permits pressure-driven exsolution while preventing redissolution during pressure recovery"
          - "the full coupled Q2/EG production rows currently retain a finite-rate conversion closure instead of the PVT history residual; retained stage-0 and production fields fail the elementwise DRSDT=0 audit, so this object does not yet provide production benchmark acceptance evidence for that history law"
          - "the irreversible_solution_gas_history_1d regression solves the PVT residual in isolation and cannot establish the coupled total-gas and free-gas phase partition used by the production CG/EG deck"
          - "the fixed-skeleton official-grid FV diagnostic passes the pinned OPM comparison through day 151 on the OPM internal time boundaries, and the combined focused black-oil checks pass 22/22 including the coupled Q2/EG deck check; its completed day-3650 run retains component conservation but fails the long-horizon OPM and nonnegative-saturation gates, and neither result verifies the finite-deformation mixture theory or its CG/EG discretization"
