# MOOSE implementation traceability notes.
# This file complements implementation_paper/equation_to_moose_map.yml with
# app-local object planning and implementation assumptions.

schema_version: 1
principles:
  - "Keep residual kernels small and traceable to named manuscript equations or reductions."
  - "Use AD materials for thermodynamic properties when possible."
  - "Keep EOS, phase equilibrium, tensor kinematics, pull-backs, and nontrivial state transformations explicit."
  - "Record every implementation closure, stabilization, and discretization choice that is not present in the theory manuscript."

object_families:
  kinematics:
    status: planned
    likely_directories:
      - "include/materials"
      - "src/materials"
    manuscript_basis:
      - "solid-skeleton kinematics and pull-back sections"
    required_notes:
      - "reference/current configuration"
      - "Jacobian and deformation-gradient definitions"

  thermodynamics:
    status: planned
    likely_directories:
      - "include/materials"
      - "src/materials"
      - "include/userobjects"
      - "src/userobjects"
    manuscript_basis:
      - "eq:MC_absolute_neutral_component_potential"
      - "eq:MC_neutral_component_euler_identity"
      - "reversible thermodynamic restrictions"
    required_notes:
      - "state set"
      - "held-fixed variables"
      - "derivative source: parsed expression, compiled material, tabulated object, or EOS solve"

  transport:
    status: planned
    likely_directories:
      - "include/kernels"
      - "src/kernels"
      - "include/fvkernels"
      - "src/fvkernels"
    manuscript_basis:
      - "component and phase mass balances"
      - "eq:MC_energy_balance"
      - "eq:MC_transport_force_gauge_objectivity"
      - "eq:MC_relative_transport_closures"
    required_notes:
      - "FE or FV variable choice"
      - "flux law"
      - "stabilization/upwinding"
      - "neutral-potential thermal gradient plus direct electric-field force"
      - "direct electric-field work on the relative charge flux"
      - "exclude isolated electric-potential-weighted charge fluxes"
      - "electric potential gauge test"

  mechanics:
    status: planned
    likely_directories:
      - "include/kernels"
      - "src/kernels"
      - "include/materials"
      - "src/materials"
    manuscript_basis:
      - "reference solid weak forms"
    required_notes:
      - "stress measure"
      - "coupling terms retained"
      - "boundary traction convention"

  reactions:
    status: planned
    likely_directories:
      - "include/materials"
      - "src/materials"
      - "include/userobjects"
      - "src/userobjects"
    manuscript_basis:
      - "eq:MC_admissible_conversion_component"
      - "eq:MC_phase_reference_transfer_work_recovery"
      - "eq:MC_transfer_work_full_recovery"
      - "eq:MC_affinity_projection"
      - "eq:MC_generalized_conversion_affinity_relation"
      - "eq:MC_temperature_weighted_reaction_power"
      - "eq:MC_reaction_energy_coupled_admissibility"
    required_notes:
      - "mechanism index convention"
      - "mass conservation check"
      - "equilibrium or kinetic law"
      - "one tau evolution and P-1 algebraic transfer-work levels"
      - "algebraic recovery of every L from hat mu, psi, tau, and phase kinematics"
      - "traditional affinity -sum(mu nu)"
      - "transfer-work correction for phase change, precipitation, dissolution, and pore filling"
      - "neutral temperature-weighted reaction force for general charged two-temperature mechanisms"
      - "separate subsystem charge conservation as the condition for electrochemical-neutral equivalence"
      - "gauge-invariant reaction-energy coupling and mechanismwise dissipation test"

validation_links:
  - validation_id: "black_oil_style_smoke"
    status: planned
    object_families:
      - transport
      - thermodynamics
  - validation_id: "reaction_source_affinity_smoke"
    status: planned
    object_families:
      - reactions
      - thermodynamics
  - validation_id: "poromechanics_limit_smoke"
    status: planned
    object_families:
