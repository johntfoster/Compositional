# Machine-readable manufactured-solution inventory for the MOOSE implementation.
# This file records executable evidence and acceptance gaps; generated outputs
# remain in moose_app/test/tests/**/gold or outside the repository.

schema_version: 1
last_reviewed: "2026-08-04"
dimension_policy:
  one_dimensional: "Required for scalar, vector-component, and balance residual paths."
  two_dimensional: "Required when Grad/Div, tensor pull-backs, phase-history kinematics, transport forces, or mechanics are dimensionally applicable."
  three_dimensional: "Required when the governing equation and MOOSE object support three active spatial components."
  material_only: "Material-only algebraic checks may be dimension-independent, but 1D/2D/3D decks are still required when the material consumes solid-reference kinematics."
  affine_patch_limit: "Affine patch tests are accepted only for constant-gradient mechanics and kinematics checks; nonlinear coupled mechanics MMS requires non-affine fields and analytic forcing."

global_acceptance_status: "verified"
global_acceptance_blockers: []
global_verification_evidence:
  command: "tools/run_moose_tests -j2 --no-color --re 'black_oil_pvt|black_oil_well|registered_phase_flash|eg_hierarchy'"
  result: "45 passed, 0 skipped, 0 failed: black_oil_pvt 11, black_oil_well 14, registered_phase_flash 13, eg_hierarchy 7"

hierarchy_migration_evidence:
  - group: "eg_hierarchy"
    status: "verified"
    focused_result: "7 passed, 0 skipped, 0 failed"
    command: "tools/run_moose_tests -j$(nproc) --re eg_hierarchy"
    q2_eg_compliance: "the nontrivial 1D and 2D poromechanics MMS cases solve EDGE3/QUAD9 Q2 displacement and P1+P0 EG pressure with mutual AD coupling through P = P_double_prime - B p_E J F_inverse_transpose and the direct summed Eq. (32) storage rate; the 1D/2D/3D hierarchy and convergence leaves retain the established Q2/EG spaces."
  - group: "reaction_tau"
    status: "verified"
    focused_result: "12 passed, 0 skipped, 0 failed"
    command: "tools/run_moose_tests -j$(nproc) --re reaction_tau"
    q2_eg_compliance: "the drained, undrained, and moving-front 1D reaction cells use EDGE3/Q2 displacement and reconstructed P1+P0 EG pressure. The quantitative 2D and 3D reaction/source leaves use QUAD9 and active-policy TET10 Q2 prescribed solid displacement, respectively, with reconstructed P1+P0 EG pressure and nonzero Darcy reference-component flux in every active spatial direction. The moving-front leaf couples total stress, the direct summed Eq. (32) storage rate, J-weighted reaction-network production, and a nonzero Darcy reference-component flux for a translating composition/reaction profile. Tau evolution/material-derivative decks use P1+P0 EG tau with tau_total material consumption; the reaction-network source deck is a material-only diagnostic exception, and the reaction-only closed box solves only the summed Eq. (32) component variables because displacement, pressure, and tau are not coupled in that reduction."
  - group: "phase_history_kinematics"
    status: "verified"
    focused_result: "9 passed, 0 skipped, 0 failed"
    command: "tools/run_moose_tests -j$(nproc) --re phase_history_kinematics"
    q2_eg_compliance: "prescribed solid displacements use Q2 AuxVariables and reusable solid-kinematics fragments; MONOMIAL CONSTANT fields are elementwise phase-history diagnostics."
  - group: "ideal_mixture_eos"
    status: "verified"
    focused_result: "6 passed, 0 skipped, 0 failed"
    command: "tools/run_moose_tests -j$(nproc) --re ideal_mixture_eos"
    q2_eg_compliance: "EOS-Darcy balance decks use Q2 solid displacements and P1+P0 EG pressure drivers consumed by EOS and Darcy materials; pure EOS decks remain material-only diagnostic reductions."
  - group: "user_helmholtz_eos"
    status: "verified"
    focused_result: "3 passed, 0 skipped, 0 failed"
    command: "tools/run_moose_tests -j1 --re user_helmholtz_eos"
    q2_eg_compliance: "the coupled 1D and genuinely 2D acceptance leaves use EDGE3/Q2 and QUAD9/Q2 prescribed displacement, respectively, with reconstructed P1+P0 EG pressure, two reconstructed P1+P0 EG neutral component potentials, and reconstructed P1+P0 EG temperature. ADHelmholtzEOSClosureMaterial closes the pressure and neutral potentials, the pressure drives Darcy flux, both neutral-potential gradients drive component extra fluxes, and two direct summed Eq. (32) variables solve the solid-reference component residuals. The 2D leaf verifies nonzero x/y fluxes and all four faces. The original EOS derivative deck remains a material-only diagnostic."
  - group: "reference_component_balance"
    status: "verified"
    focused_result: "7 passed, 0 skipped, 0 failed"
    command: "tools/run_moose_tests -j$(nproc) --re reference_component_balance"
    q2_eg_compliance: "transport decks use Q2 solid displacements; Darcy/storage decks use P1+P0 EG pressure drivers consumed by Darcy materials; storage output is a MONOMIAL CONSTANT diagnostic."
  - group: "charged_nonisothermal_transport"
    status: "verified"
    focused_result: "7 passed, 0 skipped, 0 failed"
    command: "tools/run_moose_tests -j$(nproc) --re charged_nonisothermal_transport"
    q2_eg_compliance: "component-balance decks use Q2 solid displacements and reusable solid-kinematics fragments. The nonlinear-coefficient acceptance leaf uses non-affine EDGE3/Q2 prescribed displacement and P1+P0 EG reconstructed neutral-potential, electric-potential, and temperature drivers consumed through AD gradient properties. The two-independent-component Onsager leaf uses EDGE3/Q2 prescribed displacement, two distinct P1+P0 EG reconstructed neutral potentials plus reconstructed electric-potential and temperature drivers, and solves both direct summed Eq. (32) component variables; no MONOMIAL field substitutes for a required primary or driver."
  - group: "two_phase_constant_k_split"
    status: "verified"
    focused_result: "9 passed, 0 skipped, 0 failed"
    command: "tools/run_moose_tests -j$(nproc) --re two_phase_constant_k_split"
    q2_eg_compliance: "split and split-balance decks use Q2 solid displacements; flux-balance decks use named P1+P0 EG pressure0/pressure1 drivers consumed by Darcy materials; split outputs are MONOMIAL CONSTANT diagnostics."
  - group: "phase_momentum_models"
    status: "verified"
    focused_result: "16 passed, 0 skipped, 0 failed"
    command: "tools/run_moose_tests -j$(nproc) --re phase_momentum_models"
    q2_eg_compliance: "full momentum decks use Q2 solid displacements and P1+P0 EG pressure-potential/capillary drivers; relative-flux reductions are solve=false material diagnostics using Q2/EG driver fragments."
  - group: "reference_solid_mechanics"
    status: "verified"
    focused_result: "6 passed, 0 skipped, 0 failed"
    command: "tools/run_moose_tests -j$(nproc) --re reference_solid_mechanics"
    q2_eg_compliance: "non-affine mechanics decks use Q2 displacement and reconstructed P1+P0 EG equivalent pressure; the 3D acceptance deck uses the active TET10 policy."
  - group: "registered_phase_component_flux"
    status: "verified"
    focused_result: "Full registered_phase_flash group 13 passed, 0 skipped, 0 failed, including 1D/2D/3D classical compositional CSVDiff and quantitative checkers"
    command: "tools/run_moose_tests -j$(nproc) --re registered_phase_flash"
    q2_eg_compliance: "The solved 1D/2D/3D component balances and classical compositional acceptance leaves use Q2 prescribed solid displacement and reconstructed P1+P0 EG oil/gas pressure pairs. The 3D classical leaf uses active-policy TET10, two active mobile phases, registered equilibrium-flash compositions, production Darcy and registered component assembly, and two independently solved direct summed Eq. (32) component variables with nonzero x/y/z fluxes and all six faces."
    three_dimensional_observed_errors: "component_flux_x_l2=1.334550083904e-15, component_flux_y_l2=1.1708953065835e-15, component_flux_z_l2=1.2660593653455e-15, component_l2=3.7238012298709e-17, storage0_l2=6.1833062299243e-17"

diagnostic_auxvariable_exceptions:
  - "MONOMIAL CONSTANT AuxVariables used only for material-property output, split/flash diagnostics, flux components, and scalar residual diagnostics remain valid diagnostic fields."
  - "A coupled acceptance deck cannot use a MONOMIAL CONSTANT diagnostic field as a substitute for a required Q2 displacement primary or P1+P0 EG pressure/tau field."

cases:
  - id: solid_distension_evolution_mms
    status: "verified_1d_2d_3d_axisymmetric"
    physics_blocks: ["solid distension evolution", "finite-deformation solid-reference kinematics"]
    governing_equations: ["eq:MC_solid_distension_evolution"]
    analytic_or_reference_formula: "a=1+0.2t and rhobar=2+0.5t. Cartesian affine Q2 maps use F=diag(1+0.1t), diag(1+0.1t,1-0.04t), and diag(1+0.1t,1-0.04t,1+0.03t). The RZ annulus uses radial and circumferential stretches 1+0.1t and axial stretch 1-0.05t."
    norms: [{name: "a_l2"}, {name: "rho_l2"}, {name: "solid_jacobian_l2"}, {name: "displacement_l2"}]
    tolerance:
      csvdiff_abs_zero: 1.0e-11
      coupled_petsc_jacobian: true
    dimensions:
      - dimension: "1d_q2"
        status: "verified"
        required: true
        input_deck: "moose_app/test/tests/solid_distension_evolution/solid_distension_evolution_mms_1d.i"
