  - id: q2_eg_hierarchy_mms
    physics_blocks:
      - "Q2 reference-solid mechanics"
      - "enriched-Galerkin pressure"
      - "enriched-Galerkin tau"
      - "input include hierarchy"
    governing_equations:
      - "eq:MC_overall_momentum_nonlinear_biot"
      - "eq:solid_reference_fluid_component_balance"
      - "eq:standard_darcy_mass_flux_limit"
      - "eq:reference_relative_mass_flux"
      - "eq:MC_phase_reference_transfer_work_recovery"
      - "eq:momentum_residual"
    analytic_or_reference_formula: "Included 1D/2D/3D leaves prove assembled Q2 displacement, EG pressure, EG tau, and total-field material consumption. Separate convergence leaves use sinusoidal pressure solved with P1+P0 EG diffusion, sinusoidal fluxless tau, and pressure-decoupled finite-deformation mechanics. The coupled 1D poromechanics leaf uses u_x=(0.04+0.01t)x(1-x) and p=1+0.2x+0.1t. The coupled 2D leaf uses u_x=(0.04+0.01t)x(1-x), u_y=(0.03+0.015t)y(1-y), and p=1+0.2x+0.15y+0.05xy+0.1t on QUAD9. The coupled 3D TET10 leaf adds u_z=(0.02+0.012t)z(1-z) and uses p=1+0.2x+0.15y+0.1z+0.1t. All three use P=P_double_prime-B p J F_inverse_transpose, fluid intrinsic density=2+0.5p, standard Darcy reference flux, J-weighted source, and the direct storage rate d[J phi_f fluid_intrinsic_density eta_f_alpha]/dt with phi_f=0.25 and eta_f_alpha=1."
    norms:
      - name: "ux_l2"
      - name: "uy_l2"
      - name: "uz_l2"
      - name: "ux_h1_semi"
      - name: "uy_h1_semi"
      - name: "uz_h1_semi"
      - name: "p_total_l2"
      - name: "p_material_l2"
      - name: "p_gradient_l2"
      - name: "tau_total_l2"
      - name: "tau_material_l2"
