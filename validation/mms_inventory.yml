    analytic_or_reference_formula: "The verified 1D, 2D, and 3D black-oil storage slices use p=150+10t, S_w=0.2+0.02t, S_g=0.3-0.01t, phi=0.2, zero Q2 solid displacement, and the tabular laws B_w=1.05+0.01t, B_o=1.3+0.02t, B_g=0.015+0.001t, and R_s=75+5t. Analytic sources are the direct time derivatives of sum_phase J phi_phase fluid_intrinsic_density_phase eta_phase_water, sum_phase J phi_phase fluid_intrinsic_density_phase eta_phase_oil, and sum_phase J phi_phase fluid_intrinsic_density_phase eta_phase_gas, with J supplied by EDGE3/Q2, QUAD9/Q2, or active-policy TET10/Q2 solid-reference kinematics and p supplied to PVT as the reconstructed P1+P0 EG total. The verified 1D spatial-flux leaf uses u_x=0.1x, p_o=2+x, S_w=0.2+0.1x, S_g=0.2+0.05x, phi=0.25, constant B and viscosity tables, R_s=0, linear capillary laws p_w=1.1+0.8x and p_g=2.9+1.15x, and linear relative permeabilities k_rw=0.28+0.04x, k_ro=0.5, and k_rg=0.34+0.01x. The phase Darcy laws and registered phase-to-component assembly give W_water=-(0.0448+0.0064x)/1.1, W_oil=-0.15/1.1, and W_gas=-(0.0391+0.00115x)/1.1. The verified genuinely 2D leaf uses u=(0.1x,0.2y), J=1.32, p_o=2+x+2y, S_w=0.2+0.05x+0.04y, S_g=0.2+0.03x+0.02y, p_w=1.1+0.9x+1.92y, p_g=2.9+1.09x+2.06y, k_rw=0.28+0.02x+0.016y, k_ro=0.5, and k_rg=0.34+0.006x+0.004y. With J F^-1 F^-T=diag(1.2/1.1,1.1/1.2), each phase/component flux has nonzero x and y components; analytic divergences -9.559272727273e-3, 0, and -1.468787878788e-3 are supplied directly as J-weighted water/oil/gas sources in the three summed Eq. (32) balances. The verified genuinely 3D leaf uses u=(0.1x,0.2y,0.3z), J=1.716, p_o=2+x+2y+3z, S_w=0.2+0.05x+0.04y+0.03z, and S_g=0.2+0.03x+0.02y+0.01z. With J F^-1 F^-T=diag(1.56/1.1,1.43/1.2,1.32/1.3), all phase/component fluxes have nonzero x, y, and z components; analytic divergences -1.959160839161e-2, 0, and -2.524747319347e-3 are the J-weighted sources in the three direct summed Eq. (32) balances. The verified 1D production-well leaf 