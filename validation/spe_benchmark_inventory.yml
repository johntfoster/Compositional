    evidence: "Official SPE10 model-2 page gives geometry, 60 x 220 x 85 fine grid, rock/fluid data, well locations, reporting targets, and downloadable files."
  - id: "spe11_home"
    type: "official_public_webpage"
    url: "https://www.spe.org/csp/spe11"
    evidence: "SPE11 page identifies 11A, 11B, and 11C, data DOI 10.18419/DARUS-4750, and analysis scripts at Simulation-Benchmarks/11thSPE-CSP."
  - id: "opm_data"
    type: "public_open_benchmark_deck_mirror"
    url: "https://github.com/OPM/opm-data"
    evidence: "Public decks are available for SPE1, SPE3, SPE5, SPE9, SPE10 model 1, and SPE10 model 2."
