    type: "public_open_reference_implementation"
    url: "https://github.com/OPM/opm-material"
    evidence: "EclDefaultMaterial.hpp defines the default saturation-weighted three-phase oil relative-permeability blend and its near-connate regularization used when no Stone model is selected."
