    type: "public_paper_metadata"
    url: "https://doi.org/10.2118/66599-MS"
    evidence: "Christie and Blunt describe SPE10 as two upscaling problems: a small 2D gas-injection case and a 3D waterflood through a 1.1-million-cell geological model."
  - id: "spe11_problem_definition"
    type: "public_paper_metadata"
    url: "https://doi.org/10.2118/218015-PA"
    evidence: "Problem definition for SPE11 CO2 storage benchmark."

