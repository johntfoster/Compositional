# Machine-readable SPE Comparative Solution Project inventory for the simulator
# validation scope. This file records public provenance, required physics,
# reference observables, tolerances, and current implementation status.

schema_version: 1
last_reviewed: "2026-08-05"
scope_rule: "Every official SPE Comparative Solution Project whose required physics intersects the promised simulator scope is in scope: black-oil, compositional, multiphase, miscible, thermal/reactive, fracture, well, gridding/upscaling, CO2 storage, and coupled mechanics where an official SPE CSP exists."
global_acceptance_status: "inventory_complete_spe1_one_day_full_active_history_and_controlled_convergence_pass_long_schedule_and_remaining_benchmarks_pending"
global_acceptance_blockers:
  - "All future SPE benchmark decks must use the include hierarchy in moose_app/input and the required Q2 displacement plus EG pressure/tau primary spaces for coupled production simulations."
  - "SPE1 has a separate fixed-skeleton finite-volume diagnostic through day 151 using the official SI geometry, PVT/saturation tables, layer properties, completion cells, fixed DRSDT=0 dissolved-gas history, phase/component fluxes, shared scalar well controls, and three component balances. It does not satisfy production-theory acceptance."
  - "SPE1 acceptance requires a coupled four-phase finite-deformation solid-reference solve with Q2 displacement, P1+P0 enriched-Galerkin pressure/tau, higher-order CG/EG saturation where the phase remains nondegenerate, positivity-controlled CG/EG saturation for exact phase disappearance, and a resolved phase-transformation-rate field, including mechanics, solid mass, phase-volume closure, nonequilibrium phase transformation, and two live temperature equations; no OPM threshold substitutes for those theory gates."
  - "Other in-scope families still require flexible grids, compositional phase behavior, thermal energy, miscibility mixing, and CO2-brine property packages."
  - "Dual-porosity and fracture-only benchmark work is explicitly deferred for the current implementation pass."
  - "Published/reference quantities are recorded below. The fixed-skeleton FV diagnostic is quantified through day 151; the finite-deformation CG/EG production comparison is pending and must report discrepancies without tuning to OPM."
  - "The fixed-skeleton FV diagnostic also completes the full 3650-day schedule on the pinned OPM internal time boundaries. Its conservation closes, but small negative gas saturation and 2.12/3.61 percent oil-rate/GOR plus 0.527/0.713 percent cumulative-oil/gas discrepancies keep the long-horizon comparison open."

