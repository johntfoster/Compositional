# Validation matrix for the multicomponent reactive flow implementation.
# Keep generated run outputs outside this file; store only durable case metadata.

schema_version: 1
entries:
  - id: solid_distension_evolution_mms
    status: passing_regression
    target_phenomenon: "Exact finite-deformation solid-distension evolution in Cartesian and axisymmetric solid-reference kinematics"
    manuscript_reduction:
      - "eq:MC_solid_distension_evolution"
    configuration: "Solved Q2 displacement with nonzero finite-deformation and intrinsic-density rates in Cartesian 1D/2D/3D and axisymmetric RZ; the stitched hierarchy also solves sourced conserved storage J phi_s rhobar_s, reconstructs phi_s, and audits a_s phi_s rhobar_s0 = J phi_s rhobar_s."
    variables: ["solid distension", "solid intrinsic density", "solid-reference component storage", "Q2 solid displacement components"]
    moose_objects_required:
      kernels: ["ADSolidDistensionEvolution", "ADMaterialPropertyResidual"]
      materials: ["ADSolidPhaseMassVolumeMaterial", "ADSolidReferenceKinematics", "ADAxisymmetricSolidReferenceKinematics"]
      userobjects: []
      actions: []
      boundary_conditions: []
    input_deck:
      - "moose_app/test/tests/solid_distension_evolution/solid_distension_evolution_mms_1d.i"
      - "moose_app/test/tests/solid_distension_evolution/solid_distension_evolution_mms_2d.i"
      - "moose_app/test/tests/solid_distension_evolution/solid_distension_evolution_mms_3d.i"
      - "moose_app/test/tests/solid_distension_evolution/solid_distension_evolution_mms_rz.i"
      - "moose_app/test/tests/solid_component_distension_hierarchy/solid_component_distension_hierarchy_1d.i"
      - "moose_app/test/tests/solid_component_distension_hierarchy/solid_component_distension_hierarchy_2d.i"
      - "moose_app/test/tests/solid_component_distension_hierarchy/solid_component_distension_hierarchy_3d.i"
      - "moose_app/test/tests/solid_component_distension_hierarchy/solid_component_distension_hierarchy_rz.i"
    reference_result: "a=1+0.2t, rhobar=2+0.5t, and exact affine finite-deformation determinants computed from solved Q2 displacement; RZ includes circumferential stretch."
    expected_outputs: ["a/rhobar/storage/displacement L2 errors", "reconstructed phi_s and kinematics-material J L2 errors", "component-balance and distension-mass-relation residuals", "PETSc Jacobian comparison", "invalid-state rejection"]
    pass_fail: "The atomic group passes 8/8 and the stitched group passes 7/7 with zero skips/failures. The largest final stitched norm is the 3D component-balance residual 4.1220133025417e-12; the 3D J and distension-mass-relation errors are 2.8140237968365e-12 and 2.0078776091077e-12."
    notes: "J is computed by the Cartesian or axisymmetric kinematics material from solved displacement. Reversing the J-weighted source sign changes the solved storage and fails the CSV reference; incorrect J or rhobar_s reconstruction changes both phi_s and the integrated mass relation."

  - id: q2_eg_hierarchy_mms
    status: passing_regression
    target_phenomenon: "Composable input hierarchy with Q2 solid mechanics and enriched-Galerkin pressure/tau fields"
    manuscript_reduction:
      - "eq:momentum_residual"
      - "eq:fluid_component_residual"
      - "eq:solid_reference_fluid_component_balance"
      - "eq:reference_relative_mass_flux"
      - "eq:implementation_tau_solid_frame"
    configuration: "one-, two-, and three-dimensional coupled MMS leaves assembled from reusable include fragments; displacement components use SECOND-order LAGRANGE spaces, pressure and tau use P1 LAGRANGE backbone variables plus P0 MONOMIAL enrichment variables, constitutive materials consume reconstructed total fields, and mutually coupled poromechanics acceptance is quantitative in 1D, 2D, and 3D"
    variables:
      - "solid displacement components on Q2 Lagrange finite elements"
      - "pressure backbone p and enrichment p_enr with reconstructed p_total"
      - "tau backbone tau and enrichment tau_enr with reconstructed tau_total"
      - "direct summed reference component storage J phi_f fluid_intrinsic_density eta_f_alpha in the coupled 1D, 2D, and 3D leaves"
    moose_objects_required:
      kernels:
        - "ADEnrichedGalerkinScalarBalance"
        - "ADEnrichedGalerkinScalarEnrichmentBalance"
        - "ADEnrichedGalerkinMaterialPropertyResidual"
        - "ADReferenceSolidMomentum"
      materials:
        - "ADEGReconstructedScalarMaterial"
        - "ADScalarDiffusionReferenceFluxMaterial"
        - "ADSolidReferenceKinematics"
        - "ADStandardDarcyReferenceFluxMaterial"
        - "ADReferenceSolidStressMaterial"
        - "ADReferenceFluidComponentFluxMaterial"
        - "ADTauEvolutionMaterial"
      userobjects: []
      actions: []
      dgkernels:
        - "ADEnrichedGalerkinFluxDG"
        - "ADEnrichedGalerkinSymmetryDG"
      boundary_conditions:
        - "ADEnrichedGalerkinPenaltyBC"
        - "FunctionDirichletBC"
      postprocessors:
        - "ADMaterialScalarL2Error"
        - "ADMaterialVectorL2Error"
    input_deck:
      - "moose_app/test/tests/eg_hierarchy/eg_q2_mms_1d.i"
      - "moose_app/test/tests/eg_hierarchy/eg_q2_mms_2d.i"
      - "moose_app/test/tests/eg_hierarchy/eg_q2_mms_3d.i"
      - "moose_app/test/tests/eg_hierarchy/coupled_q2_eg_poro_mms_1d.i"
      - "moose_app/test/tests/eg_hierarchy/coupled_q2_eg_poro_mms_2d.i"
      - "moose_app/test/tests/eg_hierarchy/coupled_q2_eg_poro_mms_3d.i"
    reference_result: "manufactured pressure diffusion, fluxless tau evolution with an anchored enrichment row, finite-deformation mechanics with pressure coupling, and mutually coupled 1D/2D/3D poromechanics solves using the direct summed reference component storage rate"
    expected_outputs:
      - "p_total_l2 and tau_total_l2 postprocessors"
      - "ux_l2, uy_l2, and uz_l2 postprocessors where dimensionally applicable"
      - "p_enrichment_average and tau_enrichment_average anchor diagnostics"
      - "mesh-refinement convergence script output"
      - "coupled 1D norms checked by validation/scripts/check_coupled_q2_eg_poro_mms_1d.py"
      - "coupled 2D norms checked by validation/scripts/check_coupled_q2_eg_poro_mms_2d.py"
      - "coupled 3D norms checked by validation/scripts/check_coupled_q2_eg_poro_mms_3d.py"
    pass_fail: "The focused eg_hierarchy group passes 7/7 with 0 skipped/failed. The mutually coupled 1D leaf reports all six required norms <=6.496273e-13. The mutually coupled 2D leaf reports every required norm <=5.541733e-11. The mutually coupled 3D TET10 leaf reports ux_l2=8.290929e-13, ux_h1_semi=2.115951e-11, uy_l2=5.423713e-13, uy_h1_semi=1.412566e-11, uz_l2=3.020649e-13, uz_h1_semi=8.600638e-12, p_material_l2=5.176241e-14, p_gradient_l2=1.069063e-12, p_enrichment_l2=1.064211e-13, summed_reference_component_storage_l2=6.720734e-12, and summed_reference_component_balance_residual_l2=7.171978e-12 against a 1.0e-10 limit. The separate pressure, tau, and mechanics convergence check passes all configured 1D/2D/3D rate thresholds."
    notes: "This entry gates coupled MMS/SPE acceptance. The residual-specific MMS inventory is quantitatively complete in validation/mms_inventory.yml, including reaction cells/fronts and dimensionally applicable 1D/2D/3D black-oil/compositional reductions. SPE acceptance remains separately tracked. Routine 3D Q2/EG acceptance decks use TET10; the fragment catalog rejects coupled 3D HEX27 Q2/EG combinations for this build because of the AD derivative-container limit."

  - id: selectable_phase_momentum_models
