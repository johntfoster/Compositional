    quantitative_well_source_3d: "The 2 by 3 by 4 active-policy TET10/Q2 companion uses u=(0.1x,0.2y,0.3z), J=1.716, reconstructed P1+P0 EG pressure, completion reference volume 24, and production PVT, relative-permeability, and Peaceman-well materials. Maximum required error is 1.926805e-15, maximum analytic-integral error is 3.339343e-17, integral J is 41.184, and expected/observed water, stock-tank oil, and stock-tank gas source totals are -3.333333333333e-3, -6.428571428571e-3, and -9.666666666667e-3. The focused black_oil_well group passes 14/14 with zero skips and failures."
    expected_outputs:
      - "mass balance residual norms"
      - "phase pressure and saturation fields"
    pass_fail: "All PVT/storage, storage-rate, tabular-Jacobian, capillary-reconstruction, and relative-permeability mobility L2 errors must be below 1e-12; the coupled pressure-saturation cell errors and integrated 1D/2D/3D spatial-flux and well/source direct summed Eq. (32) storage/source/global-balance/rate/BHP/control and analytic-integral errors must be below 1e-10; invalid table coordinates, out-of-range pressure under the default policy, and negative relative permeability must be rejected. Signed capillary-pressure values are permitted for SPE-compatible table conventions."
    notes: "The current slices provide pressure-tabulated AD PVT/storage/storage rates and phase viscosities, coupled 1D, 2D, and 3D Q2-solid/P1+P0-EG-pressure water/oil/gas storage-balance solves, integrated 1D, genuinely 2D, and genuinely 3D water/oil/gas spatial-flux and production-well/source solves, fixed-history static and dynamic capillary pressure reconstruction, and default ECLIPSE/OPM three-phase tabulated relative permeability with constant intrinsic permeability. Darcy mobility accepts either constant or AD material viscosity. The 3D storage and well/source leaves use the active TET10 policy. The fluxless manufactured storage problem anchors the P0 enrichment; the spatial-flux leaves use the EG oil-pressure interior-facet and weak-boundary operators. Capillary/relative-permeability history evolution, endpoint scaling, separate benchmark PVT grids and PVTO branches, and the classical compositional reductions are verified separately by the registered-phase Q2/EG 1D/2D/3D leaves."

