    target_phenomenon: "Per-registered-phase full momentum solves and algebraic relative-flux reductions"
    manuscript_reduction:
      - "eq:el_mom_f_dynamic_capillary"
      - "eq:generalized_fluid_darcy_mass_flux"
      - "eq:reference_relative_mass_flux"
      - "eq:implementation_full_phase_momentum_residual"
    configuration: "one-, two-, and three-dimensional transient full oil momentum MMS within a solid/oil/gas/water registry using Q2 prescribed solid displacement and P1+P0 EG pressure-potential/capillary drivers, plus matrix/brine solve=false relative-flux reductions with Q2/EG driver fragments, multidirectional base fluxes, and one-dimensional acceleration/capillarity switch branches"
    variables:
      - "phase velocity for momentum model full"
      - "reference relative mass flux for momentum model relative_flux"
    moose_objects_required:
      kernels:
        - "ADRegisteredPhaseMomentum"
      materials:
        - "ADSolidReferenceKinematics"
        - "ADStandardDarcyReferenceFluxMaterial"
      userobjects:
        - "PhaseRegistry"
      actions: []
      boundary_conditions:
        - "FunctionDirichletBC; ADRegisteredPhaseMomentumTractionBC is available for natural data"
    input_deck:
      - "moose_app/test/tests/phase_momentum_models/full_phase_momentum_1d.i"
      - "moose_app/test/tests/phase_momentum_models/full_phase_momentum_1d.i with include_capillary_pressure=true"
      - "moose_app/test/tests/phase_momentum_models/full_phase_momentum_2d.i"
      - "moose_app/test/tests/phase_momentum_models/full_phase_momentum_2d.i with include_capillary_pressure=true"
      - "moose_app/test/tests/phase_momentum_models/full_phase_momentum_3d.i"
      - "moose_app/test/tests/phase_momentum_models/full_phase_momentum_3d.i with include_capillary_pressure=true"
      - "moose_app/test/tests/phase_momentum_models/relative_flux_reduction_1d.i"
      - "moose_app/test/tests/phase_momentum_models/relative_flux_reduction_2d.i"
      - "moose_app/test/tests/phase_momentum_models/relative_flux_reduction_3d.i"
      - "moose_app/test/tests/phase_momentum_models/relative_flux_reduction_1d.i with include_acceleration=true"
      - "moose_app/test/tests/phase_momentum_models/relative_flux_reduction_1d.i with include_capillary_pressure=true"
      - "moose_app/test/tests/phase_momentum_models/relative_flux_reduction_1d.i with acceleration and capillary pressure enabled"
    reference_result: "full momentum v_i = t X_i with material acceleration X_i(1+t^2), base pressure force 0.5, optional capillary force 1, and drag t X_i; reduced brine flux components are -3 in the base case, -9 with either supplied a_i=1 or gamma=2x in the 1D switch cases, and -15 when both switches are enabled"
    expected_outputs:
      - "velocity_l2 component postprocessors for the full solve"
      - "flux_l2 component postprocessors for the algebraic reduction"
    pass_fail: "The focused phase_momentum_models group passed 16/16 after Q2/EG migration with abs_zero = 1e-12. Full-momentum velocity errors are at most 4.4127889763761e-14 in 1D, 1.6907196940566e-13 in 2D, and 1.1105490729189e-14 in 3D in the gold CSVs; capillary variants have comparable roundoff errors. Reduced-flux component errors are zero or roundoff in 1D, 2D, and 3D. Four RunException tests verify that both momentum paths reject a missing enabled capillary field and a capillary field while disabled."
    notes: "The full kernel supports optional extra Cauchy/Maxwell stress, added phase interactions, conversion insertion, gravity, reference traction, independently switched phase capillarity, and optional EG pressure-potential/capillary enrichment. The MMS isolates inertia, advection, equivalent pressure, phase capillarity, and skeleton drag."

  - id: conversion_corrected_phase_transforming_relative_flux_regression
    status: implemented_existing_regressions_pending_current_serialized_rerun
    target_phenomenon: "Scalar and anisotropic conversion-corrected phase-relative flux with modular pressure, transfer-potential, body, acceleration, and electrical force families"
    manuscript_reduction:
      - "eq:fluid_phase_interaction_law"
      - "eq:relative_flux_linear_system"
      - "eq:modified_relative_flux_permeability"
      - "eq:modified_relative_flux_scalar_admissibility"
    configuration: "The scalar one-dimensional material cases evaluate the conversion-corrected resistance and tau insertion force on Q2 solid-reference kinematics, including active, inactive, zero-relative-permeability, and inadmissible-resistance branches. The two-dimensional QUAD9 case evaluates a diagonal anisotropic permeability tensor, separately assembled pressure gradient, tensor mobility and resistance diagnostics, and the pulled-back reference flux."
    variables:
      - "phase pressure or separately assembled phase-pressure gradient"
      - "transfer potential tau"
      - "Q2 solid displacement or supplied solid velocity"
    moose_objects_required:
      kernels:
        - "ADRegisteredPhaseMomentum for the full velocity-based drag-law path"
      materials:
        - "ADConversionCorrectedDarcyReferenceFluxMaterial"
        - "ADPhaseTransformingDarcyReferenceFluxMaterial"
        - "ADPhaseTransformingPressureGradientDarcyReferenceFluxMaterial"
        - "ADSolidReferenceKinematics"
      userobjects:
        - "PhaseRegistry for registered relative_flux phases"
      actions: []
      boundary_conditions: []
    input_deck:
      - "moose_app/test/tests/conversion_corrected_darcy/conversion_corrected_relative_flux_1d.i"
      - "moose_app/test/tests/phase_transforming_darcy/phase_transforming_relative_flux_1d.i"
      - "moose_app/test/tests/anisotropic_phase_transforming_darcy/anisotropic_phase_transforming_darcy_2d.i"
      - "moose_app/test/tests/anisotropic_phase_transforming_darcy/anisotropic_phase_transforming_darcy_bad_tensor.i"
    reference_result: "The scalar conversion-corrected diagnostic has resistance 1.5 and pulled-back flux 8/3. The registered phase-transforming tests retain exact zero inactive and zero-relative-permeability limits and reject loss of positive resistance. The anisotropic case has denominator eigenvalues 0.35, 0.4, and 0.45 and pressure-mobility eigenvalues 10/7, 15/8, and 20/9."
    expected_outputs:
      - "scalar resistance and reference-flux L2 errors"
      - "anisotropic resistance, denominator, mobility, and reference-flux L2 errors"
      - "nonpositive conversion-corrected resistance rejection"
      - "indefinite permeability rejection"
    pass_fail: "The existing CSVDiff references require every scalar and anisotropic diagnostic to match the analytic values at 1e-11 relative or 1e-12 absolute tolerance. RunException cases require the positive-resistance and permeability-definiteness guards. These focused groups were not rerun while another agent owned the serialized MOOSE test queue."
    verification_commands:
      - "tools/run_moose_tests -j1 --re 'conversion_corrected_darcy|phase_transforming_darcy|anisotropic_phase_transforming_darcy'"
    notes: "The modular templates are moose_app/input/templates/phase_transforming_darcy.i and moose_app/input/templates/anisotropic_phase_transforming_pressure_gradient.i.template. The scalar full-force material makes capillary or dynamic-lag pressure, electrical force, gravity, acceleration, and conversion insertion independently selectable."

