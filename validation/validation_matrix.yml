    notes: "The executable CG/EG slice contains tau backbone/enrichment, black-oil electrochemical potentials, reconstructed current phase velocities, tau material derivatives, tau-corrected affinity, directional phase availability, finite-rate conversion, dissolved/free gas source/storage split, nonnegative dissipation diagnostics, conversion insertion in all three overall-momentum rows, two solved temperature equations with storage, heat flux, interphase exchange, and full generalized conversion-transfer work, and active injector/producer scalar rate-BHP controls. The PVT material exposes the DRSDT=0 attainable-ratio and history residuals, but the production residual set has not yet coupled them as governing equations; the added audit prevents the resulting local redissolution from being accepted. The production-space reduced partition uses P1 dissolved gas and transfer rate with P2 Bernstein plus P0 free gas and satisfies its storage and AD-Jacobian checks. Its nonzero constrained rate at zero chemical affinity requires an explicit irreversible history state or nonsmooth dissipation potential and an admissibility condition on the tau-corrected generalized force before production momentum, energy, and dissipation evidence can be claimed. SPE1 supplies no absolute chemical-potential reference data, phase-transfer resistance, or thermal calibration; the input deck declares these closures and the report identifies their gauge and calibration scope. Each runner artifact records the resolved PVT and OPM sources plus the uncalibrated transfer, thermal, skeleton, and boundary specializations in physical_scope_audit.json. Spatial, timestep, and isolated P1/P2 saturation-order convergence are recorded in validation/results/spe1_case1/convergence_summary_v1.json and the benchmark report. A direct boundary-flux decomposition of global energy and the official long-horizon comparison remain pending. The fixed-skeleton cell-centered FV path remains diagnostic only."

