    reference_result: "At p=150 on a two-point table, the PVT slice obtains B_w=1.05, B_o=1.3, B_g=0.015, R_s=75, and water/oil/gas viscosities 0.35/1.5/0.025 and reproduces the manuscript water, oil, and gas storage identifications to roundoff. A Newton solve from p=125 recovers p=150 in one nonlinear update through the tabular AD slope. The 1D EDGE3, 2D QUAD9, and active-policy 3D TET10 cells advance reconstructed P1+P0 EG pressure, S_w, and S_g through direct J-weighted water/oil/gas storage rates and analytic manufactured sources. The 3D final errors are pressure_l2=2.5916174936096e-12, pressure_enrichment_l2=1.4038894920175e-13, water_saturation_l2=4.9737237718842e-16, gas_saturation_l2=2.4981653138052e-15, J_l2=0, and all three storage-rate/source L2 errors zero. The integrated 1D spatial-flux leaf combines EDGE3/Q2 kinematics, reconstructed P1+P0 EG oil pressure, capillary-reconstructed water and gas pressures, production PVT and relative-permeability materials, and registered phase-to-component flux assembly. Its maximum required error is 4.965068e-16, maximum face/integral error is 3.635980e-15, water and gas net-outward fluxes are -5.818181818182e-3 and -1.045454545455e-3, and all three direct summed Eq. (32) global balances are zero to roundoff. The genuinely 2D QUAD9/Q2 and P1+P0 EG leaf uses u=(0.1x,0.2y), nonzero x/y oil, water, and gas pressure gradients, capillary reconstruction, production relative permeability, three phase Darcy fluxes, and registered phase-to-component assembly. Its maximum required error is 5.900916e-16, maximum face/integral error is 3.635980e-15, water/gas net-outward fluxes are -9.559272727273e-3 and -1.468787878788e-3, all twelve phase-component boundary values are nonzero, and all three direct summed Eq. (32) balances are below 5.0e-16. The genuinely 3D active-policy TET10/Q2 and P1+P0 EG leaf extends the affine state into z, checks all x/y/z phase and component fluxes and eighteen nonzero face integrals, obtains maximum required and face-integral errors 9.992007e-16 and 3.858025e-15, water/gas net-outward fluxes -1.959160839161e-2 and -2.524747319347e-3, and all direct summed Eq. (32) balances below 1.0e-15. The 1D well/source MMS couples EDGE3/Q2 kinematics and reconstructed P1+P0 EG pressure through production PVT, relative-permeability, and Peaceman-well materials into the direct sum_xi J phi_xi fluid_intrinsic_density_xi eta_xi_component water/oil/gas balances. Its maximum required and analytic-integral errors are 1.713248e-12 and 1.383268e-14, with water/oil/gas source integrals -3.333333333338e-3, -6.428571428580e-3, and -9.666666666680e-3; the focused black_oil_well group passes 12/12. Static and dynamic capillary tests reconstruct water and gas pressures with the manuscript signs to roundoff. The SWOF/SGOF slice reproduces the default ECLIPSE/OPM oil-curve blend and preserves active table slopes in the AD Jacobian. The Darcy mobility slice uses S=0.5, k_r=S^2=0.25, and a base reference mass flux of -3 to obtain -0.75 exactly; a material viscosity of 4 in place of the constant value 2 obtains -1.5 exactly. Classical compositional reductions are verified by the registered-phase Q2/EG 1D/2D/3D leaves."
